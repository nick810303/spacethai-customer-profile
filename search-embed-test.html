<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="robots" content="noindex">
<title>顧客搜尋（內嵌）</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#FAF7F4;--card:#fff;--br:#EDE5DF;--br2:#F4EEE9;--t:#2C2520;--m:#85766D;--h:#B3A59B;--hd:#FAF7F4;--bd:#8C513C;--ac:#8C5E48;--ink:#3D2E26}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:13px/1.4 Manrope,'Noto Sans TC',sans-serif;font-variant-numeric:tabular-nums;padding-inline:12px;padding-block:12px 40px}
.app{max-width:980px;margin:0 auto}
.top{display:flex;gap:6px;align-items:center}
.inp{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--br);border-radius:10px;padding:0 6px 0 11px;height:38px;min-width:0;box-shadow:0 1px 2px rgba(60,40,30,.04);transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:#8C5E48;box-shadow:0 0 0 3px rgba(140,94,72,.12)}
.inp input{flex:1;border:0;outline:0;background:transparent;font:500 14px Manrope,'Noto Sans TC';color:var(--t);min-width:0}
.inp svg{width:15px;height:15px;fill:none;stroke:var(--h);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.clr{display:none;border:0;background:var(--br2);color:var(--m);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:22px;padding:0;flex:none}.clr.on{display:block}
.ib{height:38px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--t);font:600 13px Manrope,'Noto Sans TC';padding:0 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex:none;position:relative}
.ib svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib .n{background:var(--ink);color:#fff;border-radius:999px;font:700 10px Manrope;min-width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.ib.on{border-color:var(--ink)}
#bf{background:#F6ECE4;color:#6B3F2B;border:1px solid #DDBFAC;font-size:13.5px;font-weight:700;padding:0 12px 0 11px;gap:7px;box-shadow:none}
#bf:hover{background:#F1E2D6}
#bf svg{width:16px;height:16px;color:#8C5E48}#bf .cvr{width:12px;height:12px;opacity:.7;transition:transform .2s;margin-left:-1px}#bf.open .cvr{transform:rotate(180deg)}
#bf.on{background:var(--ink);color:#fff;border-color:var(--ink)}#bf.on svg{color:#fff}
#bf .n{background:#8C5E48;color:#fff}#bf.on .n{background:#fff;color:var(--ink)}
#bc{background:transparent;border-color:var(--br);color:var(--m)}
.sg{display:flex;gap:6px;margin:7px 1px 0;overflow-x:auto;scrollbar-width:none;font-size:11px;color:var(--h);align-items:center;white-space:nowrap}.sg::-webkit-scrollbar{display:none}
.sg b.fi{animation:fi .45s ease both}@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sg em{font-style:normal;color:var(--h);font-size:10px;margin-left:2px}
.sg b{background:var(--card);border:1px solid var(--br);color:var(--m);border-radius:999px;font:500 11px Manrope,'Noto Sans TC';padding:2px 9px;cursor:pointer}
.act{display:flex;gap:6px;margin:8px 0 0;flex-wrap:wrap}
.ch{display:inline-flex;align-items:center;gap:5px;background:#F1E6DE;color:#5A3D2E;border-radius:999px;font:600 11px Manrope,'Noto Sans TC';padding:3px 6px 3px 10px;cursor:pointer}.ch i{font-style:normal;opacity:.55;font-size:10px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:9px 2px 5px;font-size:11px;color:var(--m);gap:8px;flex-wrap:wrap}.meta b{color:var(--t)}
.w{display:inline-block;border-radius:5px;font:700 11px Manrope,'Noto Sans TC';padding:0 7px;margin-left:3px;color:var(--t);border:1.5px solid}
.tw{background:var(--card);border:1px solid var(--br);border-radius:12px;overflow:auto;max-height:600px;position:relative}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12px}
td{overflow:hidden;text-overflow:ellipsis}
th,td{padding:0 8px;height:30px;white-space:nowrap;border-bottom:1px solid var(--br2);text-align:left}
th{position:sticky;top:0;z-index:3;background:var(--hd);font:600 10.5px Manrope,'Noto Sans TC';color:var(--h);cursor:pointer;user-select:none;height:28px;letter-spacing:.03em}
th.r,td.r{text-align:right}th .ar{display:inline-block;width:11px;color:var(--ac);font-size:9px;margin-left:2px}th:not(.on) .ar{color:var(--h);opacity:.55;font-size:10px}th:hover .ar{opacity:1}th.on{color:var(--t)}
tbody tr:hover td{background:#FBF5F0}tbody tr:last-child td{border-bottom:0}
.stk{position:sticky;left:0;z-index:2;background:var(--card)}th.stk{z-index:4;background:var(--hd)}
.stk2{position:sticky;left:60px;z-index:2;background:var(--card);box-shadow:1px 0 0 var(--br2)}th.stk2{z-index:4;background:var(--hd)}
td.num{font:700 12px Manrope;color:var(--bd)}td.num i{font-style:normal;opacity:.45;font-size:10px}td.num,td.nm,th.stk,th.stk2{padding:0 5px}
td.nm{font-weight:700;cursor:pointer}
.tg{display:inline-flex;align-items:center;gap:3px;font:700 10px/1 'Noto Sans TC';color:#fff;border-radius:999px;padding:3px 7px 3px 5px;border:1.3px solid transparent}
.fq{display:inline-flex;align-items:center;gap:3px;font:700 10px/1 'Noto Sans TC';color:#fff;border-radius:999px;padding:3px 8px 3px 6px;white-space:nowrap}.fq:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}.fq.fg{background:#17797A}.fq.fy{background:#DBA400;text-shadow:0 1px 1px rgba(110,72,0,.55)}.fq.fd{background:#D2690A}.mdn{font:700 12px Manrope,'Noto Sans TC',sans-serif;margin-right:3px}.mdn small{font:500 10px 'Noto Sans TC';color:var(--m);margin-left:1px}.tg svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sc2{display:inline-block;border-radius:999px;font:600 10px/1 'Noto Sans TC';padding:3px 7px;color:#fff;margin-left:5px;vertical-align:1px}
.sub2{color:var(--h);font-size:10px}
.rj{display:inline-block;border-radius:999px;font:600 10px/1 'Noto Sans TC';padding:3px 7px;color:#fff}.rj b{font-size:11px;font-weight:800}
.rj.r1{background:#A63D40}.rj.r2{background:#D9822B}.rj.r3{background:#7C8794}.rj.r0{background:#2B2B2B}.rj.r4{background:#7B5EA7}
.rs{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:6px;font:800 11px/1 'Noto Sans TC';color:#fff}.rs.r0{background:#2B2B2B;font-size:10px}.rs.r1{background:#A63D40}.rs.r2{background:#D9822B}.rs.r3{background:#7C8794}.rs.r4{background:#7B5EA7}body[data-hl=A] .rs mark{background:#fff;color:#2C2520;padding:0 1px;border-radius:2px}
.age{display:inline-block;margin-left:5px;background:#F1ECE8;color:#85766D;border-radius:999px;font:600 10px Manrope,'Noto Sans TC';padding:1px 7px}
td.mc,td.ell{cursor:pointer}.mr{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}.mr .more{font:700 10px Manrope;color:var(--m);background:var(--br2);border-radius:999px;padding:0 5px;line-height:15px}
.pn{display:flex;align-items:center;gap:5px;min-width:0}.pc{flex:none;width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center}.pc svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;border-radius:5px;padding:1px 6px;min-width:0;border:1px solid}
.pn.pin .pc{background:#E0A010;color:#3d2f04}.pn.pin .pt{background:#FFF1BF;border-color:#E7C44F}
.pn.ln .pc{background:#6F5A4E;color:#fff}.pn.ln .pt{background:#F1ECE8;border-color:#D9CEC7}
.pn .more{flex:none;font:700 10px Manrope;color:var(--m);background:var(--br2);border-radius:999px;padding:0 5px;line-height:15px}
.pn.note .pt{background:#FFF9E6;border:1px dashed #E2C877}
.hits{display:flex;flex-direction:column;gap:2px;line-height:1.25;white-space:normal;font-size:11px}.hits .ht{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hits .hl{color:var(--h);font-size:10px;margin-right:3px}
td.hc{height:auto;min-height:30px;padding-top:2px;padding-bottom:2px}
/* 反黃樣式：data-hl = A/B/C/D；h0/h1/h2 為三個搜尋詞的顏色 */
body{--k0:#E8A100;--k1:#1F9D6B;--k2:#D6336C;--b0:#FFE27A;--b1:#BDEBD0;--b2:#FFC9D1}
mark{color:inherit;background:none;font-weight:inherit}
body[data-hl=A] mark.h0{background:var(--b0)}body[data-hl=A] mark.h1{background:var(--b1)}body[data-hl=A] mark.h2{background:var(--b2)}body[data-hl=A] mark{border-radius:3px;padding:0 1px}
body[data-hl=B] mark{font-weight:800;text-decoration:underline;text-decoration-thickness:2.5px;text-underline-offset:2px}
body[data-hl=B] mark.h0{text-decoration-color:var(--k0)}body[data-hl=B] mark.h1{text-decoration-color:var(--k1)}body[data-hl=B] mark.h2{text-decoration-color:var(--k2)}
body[data-hl=C] mark{border:1.5px solid;border-radius:4px;padding:0 2px;font-weight:700;margin:0 -1px}
body[data-hl=C] mark.h0{border-color:var(--k0)}body[data-hl=C] mark.h1{border-color:var(--k1)}body[data-hl=C] mark.h2{border-color:var(--k2)}
body[data-hl=D] mark{font-weight:800}body[data-hl=D] mark.h0{color:#C77700}body[data-hl=D] mark.h1{color:#13805A}body[data-hl=D] mark.h2{color:#C2255C}
/* 色塊內的反黃：改成白底深字／白色底線，確保讀得清 */
body[data-hl=A] .rj mark,body[data-hl=A] .tg mark,body[data-hl=A] .sc2 mark{background:#fff;color:#2C2520}
body[data-hl=B] .rj mark,body[data-hl=B] .tg mark,body[data-hl=B] .sc2 mark{text-decoration-color:#fff!important}
body[data-hl=C] .rj mark,body[data-hl=C] .tg mark,body[data-hl=C] .sc2 mark{border-color:#fff!important}
body[data-hl=D] .rj mark,body[data-hl=D] .tg mark,body[data-hl=D] .sc2 mark{color:#fff!important;text-decoration:underline;text-decoration-thickness:2px}
body[data-hl=A] .pt mark.h0,body[data-hl=A] .pt mark.h1,body[data-hl=A] .pt mark.h2{box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.hlsw{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:10px;color:var(--h)}.hlsw button{white-space:nowrap;border:1px solid var(--br);background:var(--card);color:var(--m);font:700 10px Manrope;border-radius:6px;padding:1px 7px;cursor:pointer}.hlsw button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* 浮層 */
.pop{position:fixed;z-index:60;background:var(--card);border:1px solid var(--br);border-radius:12px;box-shadow:0 14px 34px rgba(60,40,30,.18);padding:11px;width:min(300px,calc(100vw - 24px));display:none}.pop.on{display:block}
.ofb{margin-top:9px;width:100%;height:34px;border-radius:9px;border:1px solid #DDBFAC;background:#F6ECE4;color:#6B3F2B;font:700 13px Manrope,'Noto Sans TC';cursor:pointer}.ofb:hover{background:#F1E2D6}
#tb tr[data-n]{cursor:pointer}#tb tr[data-n]:hover td{background:#FBF6F0}#tb tr[data-n]:hover td.stk,#tb tr[data-n]:hover td.stk2{background:#FBF6F0}
#fv{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column}#fv.on{display:flex}
#fv .fh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--br);background:var(--card)}#fv .fh button{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--br);background:var(--card);font:700 13px Manrope,'Noto Sans TC';color:var(--ink);cursor:pointer}
#fv .fb{padding:22px 16px;color:var(--m);font:500 13px/1.7 Manrope,'Noto Sans TC'}#fv .fb b{color:var(--ink);font-size:16px}
.pop h6{margin:0 0 7px;font:700 11px Manrope,'Noto Sans TC';color:var(--h);letter-spacing:.05em}
.bk{position:fixed;inset:0;background:rgba(30,20,15,.32);z-index:70;display:none}.bk.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(40,25,15,.2);max-height:84vh;display:none;flex-direction:column;max-width:560px;margin:0 auto}.sheet.on{display:flex}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}.sh-h b{font-size:15px}.sh-h button{border:0;background:var(--br2);width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--m)}
.sh-b{overflow:auto;padding:0 16px 8px}.sh-f{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--br2)}.sh-f button{height:40px;border-radius:11px;border:0;font:600 13px Manrope,'Noto Sans TC';cursor:pointer}.sh-f .c{background:var(--br2);color:var(--t);padding:0 16px}.sh-f .o{flex:1;background:var(--ink);color:#fff}
.sec{margin:12px 0 0}.sec:first-child{margin-top:2px}.sec h6{margin:0 0 7px;font:700 11px Manrope,'Noto Sans TC';color:var(--h);letter-spacing:.05em;display:flex;justify-content:space-between}.sec h6 a{color:var(--ac);cursor:pointer;font-weight:600;letter-spacing:0}
.sec .hint{font-size:10px;color:var(--h);margin:0 0 5px}
.divd{margin:16px 0 0;padding-top:12px;border-top:1px dashed var(--br);font:700 11px Manrope,'Noto Sans TC';color:var(--m)}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opt{border:1px solid var(--br);background:var(--card);border-radius:8px;font:600 12px Manrope,'Noto Sans TC';padding:5px 10px;cursor:pointer;color:var(--t)}.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pre{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.ds .dv{font-size:12px;color:var(--m);margin-bottom:2px}.ds .dv b{color:var(--t)}
.trk{position:relative;height:26px}.trk::before{content:"";position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:var(--br)}
.trk .fill{position:absolute;top:11px;height:4px;background:#8C5E48;border-radius:2px}
.trk input{position:absolute;left:0;width:100%;top:0;height:26px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.trk input::-webkit-slider-runnable-track{background:none;height:26px}.trk input::-moz-range-track{background:none}
.trk input::-webkit-slider-thumb{pointer-events:all;-webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:2px;border-radius:50%;background:#fff;border:2.5px solid #8C5E48;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.trk input::-moz-range-thumb{pointer-events:all;width:18px;height:18px;border-radius:50%;background:#fff;border:2.5px solid #8C5E48;cursor:pointer}
.pf{display:flex;justify-content:space-between;margin-top:9px;font-size:11px}.pf a{color:var(--ac);font-weight:700;cursor:pointer}
.hd{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--br);border-radius:12px;padding:9px 12px;cursor:pointer;margin-bottom:8px}
.hd b{font-size:14px}.hd .sum{flex:1;font-size:11px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd .cv{color:var(--h);transition:transform .2s}.hd.closed .cv{transform:rotate(-90deg)}
#tool.closed{display:none}
.fp{display:none;flex-direction:column;border:1px solid var(--br);border-radius:12px;background:var(--card);margin-top:8px;max-height:58vh;box-shadow:0 6px 20px rgba(60,40,30,.07)}.fp.on{display:flex}
.fp .sh-h{padding:11px 14px 4px}.fp .sh-b{padding:0 14px 6px}.fp .sh-f{padding:9px 14px 12px}
.tipbar{font-size:11px;color:var(--m);background:#F6EFE9;border-radius:8px;padding:7px 10px;margin:4px 0 2px;line-height:1.5}
.mm,.ss{font:600 10px Manrope,'Noto Sans TC';border-radius:5px;padding:0 6px;margin-left:6px;letter-spacing:0}.mm{background:#E4EEE8;color:#2F6B4F}.ss{background:#EDEAF4;color:#5B4C8A}
.cnt2{margin-left:auto;font:600 10px Manrope;color:var(--ac);letter-spacing:0}
.ck{display:inline-block;width:12px;height:12px;border:1.5px solid #CBBFB6;border-radius:3px;margin-right:6px;vertical-align:-2px;position:relative;flex:none}
.ck.rd{border-radius:50%}
.opt.on .ck{background:#fff;border-color:#fff}.opt.on .ck::after{content:"";position:absolute;left:2.5px;top:-.5px;width:3px;height:6px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt.on .ck.rd::after{left:2px;top:2px;width:4px;height:4px;border:0;border-radius:50%;background:var(--ink);transform:none}
.qm{display:inline-flex;width:14px;height:14px;border-radius:50%;border:1.3px solid var(--h);color:var(--h);font:700 9px/11px Manrope;align-items:center;justify-content:center;margin-left:4px;cursor:pointer;flex:none;letter-spacing:0;vertical-align:1px}
.opt.on .qm{border-color:#fff;color:#fff}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}.ph h6{margin:0}.px{border:0;background:var(--br2);color:var(--m);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:11px;flex:none}
.hc2 .r{display:flex;gap:8px;align-items:flex-start;margin:7px 0;font-size:12px;line-height:1.5}.hc2 .r .tg{flex:none;min-width:84px;justify-content:flex-start}.hc2 .lead{background:#F7F2EE;border-radius:8px;padding:7px 10px;font-size:12px;color:#5C4A3F;margin-bottom:6px}
.mock{margin:10px 2px 0;font-size:10px;color:var(--h)}.mock button{border:1px solid var(--br);background:var(--card);color:var(--m);font:700 10px Manrope,'Noto Sans TC';border-radius:6px;padding:1px 7px;cursor:pointer;margin-left:4px}.mock button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fp{max-height:42vh;margin-top:6px;border-radius:12px}
.fp .sh-h{padding:8px 12px 2px;align-items:center}.fp .sh-h b{font-size:13px}.fp .sh-h .cl{font-size:11px;color:var(--ac);cursor:pointer;font-weight:600;margin-left:auto;margin-right:8px}
.fp .sh-b{padding:0 12px 4px}.fp .sh-f{padding:6px 12px 9px}.fp .sh-f button{height:32px;font-size:12px;border-radius:9px}
.rowf{display:grid;grid-template-columns:46px 1fr;gap:4px;align-items:start;padding:6px 0;border-bottom:1px solid var(--br2)}.rowf:last-child{border-bottom:0}
.rowf .lb{font:600 11px/1.9 Manrope,'Noto Sans TC';color:var(--m);display:flex;align-items:center;flex-wrap:wrap}
.fp .opts{gap:4px}.fp .opt{font-size:11px;padding:1px 6px;border-radius:6px;line-height:1.7}.fp .ck{width:10px;height:10px;margin-right:3px;vertical-align:-1px}
.fp .opt.on .ck::after{left:2px;top:-1px;width:3px;height:6px}
.opts.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.opts.g4 .opt{display:flex;align-items:center;justify-content:center;padding:1px 2px}
.fp .opt.more{color:#8C5E48;background:#F6EBE3;border-color:#E6D3C7;font-weight:700}
.opts.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.opts.g3 .opt{display:flex;align-items:center;justify-content:center;padding:1px 2px}
.fp .opt.tgl{border:0;background:none;padding:2px 0;margin-top:4px;color:#8C5E48;font-weight:700;font-size:11px}.fp .opt.tgl em{font-style:normal;margin-left:6px;color:#fff;background:#8C5E48;border-radius:999px;padding:0 6px;font-size:10px}.tg2{width:100%}
.fp .opt.more{color:#8C5E48;background:none;border-style:dashed}
.fp .opt.lf,.fp .opt.more{color:#9A948E;background:#EEECE9;border-color:#E2DFDB}.fp .opt.lf.on{color:#5E5953;background:#E2DFDB;border-color:#B9B4AE}
