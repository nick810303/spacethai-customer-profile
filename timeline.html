<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小泰空 · 時間軸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* ── 與顧客檔案系統 style-*.css 同一組 tokens ── */
  :root{
    --brand:#AE6C56; --brand-dark:#91563E; --brand-light:#F8F2EE; --brand-bg:rgba(174,108,86,.07); --brand-bdr:rgba(174,108,86,.22);
    --gold:#C9A84C; --green:#2a9d5c; --red:#D94F4F;
    --text:#111; --text-muted:#888; --text-hint:#bbb;
    --border:#e8e8e8; --border2:#ebebeb; --surface:#fff; --surface2:#f7f7f7; --surface3:#fafafa;
    --nj:#2F5E4A; --zs:#B84E2C;
    --d120:#CFB3B3; --d90:#D1C2B3; --d60:#EAD6C5; --d90f:#EBE4C5; --tr:#C0D3B5; --badge:#DF4B3C;
    --blk:#F0EBE7; --blk-bdr:#E3DAD3;
    --mono:'DM Mono',ui-monospace,Menlo,monospace;
    --sans:'Noto Sans TC',-apple-system,system-ui,sans-serif;
    --hour-w:112px; --row-h:54px; --name-w:190px; --panel-w:380px;
    --hour-h:64px; --col-w:36px; --axis-w:34px;   /* 直屏 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--surface2);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  /* ── 頂欄 ── */
  header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
  .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:15px;margin-right:6px}
  .brand small{font-family:var(--mono);font-weight:400;color:var(--text-muted);margin-left:8px;font-size:12px}
  body.embedded .brand{display:none}
  .datenav{display:flex;align-items:center;gap:4px;font-family:var(--mono)}
  .datenav button{width:30px;height:30px;border:1px solid var(--border);border-radius:8px;color:var(--text-muted);background:var(--surface)}
  .datenav button:hover{border-color:var(--brand)}
  .datenav .d{font-size:15px;padding:0 6px;white-space:nowrap;cursor:pointer}
  .datenav .today{width:auto;padding:0 10px;font-size:12px;white-space:nowrap}
  .datenav input[type=date]{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
  .dot.all{background:linear-gradient(90deg,var(--nj) 50%,var(--zs) 50%)}
  .pplbtn .dot{margin-right:5px;vertical-align:0}
  .pop.brpop{width:180px}
  .pop.brpop label input{accent-color:var(--brand)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .ppl{position:relative}
  .pplbtn{height:30px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;color:var(--text-muted);white-space:nowrap}
  .pplbtn.act{border-color:var(--brand);color:var(--brand-dark)}
  .pplbtn span{font-family:var(--mono);font-size:11px}
  .pop{display:none;position:absolute;top:36px;left:0;z-index:50;width:260px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:8px 10px;font-size:13px}
  .pop.open{display:block}
  .pop label{display:flex;align-items:center;gap:8px;padding:5px 2px;cursor:pointer}
  .pop .row1{border-bottom:1px solid var(--border2);padding-bottom:8px;margin-bottom:6px;font-weight:500}
  .pop .acts{display:flex;gap:6px;margin-bottom:6px}
  .pop .acts button{flex:1;height:26px;border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text-muted);background:var(--surface2)}
  .pop .grp{font-size:11px;color:#fff;padding:1px 7px;border-radius:5px;display:inline-block;margin:8px 0 2px;font-weight:700}
  .pop .av{width:22px;height:22px;font-size:10px}
  .pop .off{color:var(--text-hint)}
  .spacer{flex:1}
  .src{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text-muted);white-space:nowrap}
  .src .pulse{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .src.busy .pulse{animation:blink 1s infinite}
  .src.err{color:var(--red)} .src.err .pulse{background:var(--red)}
  @keyframes blink{50%{opacity:.3}}
  .legend{display:flex;gap:12px;padding:0 12px 8px;font-size:11px;color:var(--text-muted);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .legend i{width:12px;height:9px;border-radius:2px;display:inline-block}
  /* ── 主板 ── */
  .main{position:relative;height:calc(100vh - var(--head-h,98px))}
  .board{position:relative;overflow:auto;height:100%;-webkit-overflow-scrolling:touch}
  .msg{padding:60px 20px;text-align:center;color:var(--text-muted);font-size:14px}
  .msg a{color:var(--brand)}
  /* ── 橫版（電腦）：老師列 × 時間橫軸 ── */
  .grid{display:grid;grid-template-columns:var(--name-w) 1fr;min-width:max-content;background:var(--surface)}
  .axis{display:contents}
  .axis .corner{position:sticky;left:0;top:0;z-index:21;background:var(--surface);border-bottom:1px solid var(--border);border-right:1px solid var(--border);height:34px;display:flex;align-items:flex-end;padding:0 12px 6px;font-family:var(--mono);font-size:11px;color:var(--text-hint)}
  .axis .hours{position:sticky;top:0;z-index:20;height:34px;border-bottom:1px solid var(--border);background:var(--surface)}
  .axis .h{position:absolute;bottom:6px;font-family:var(--mono);font-size:12px;color:var(--text-muted);transform:translateX(-50%)}
  .axis .h::after{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:6px;background:var(--border)}
  .axis .hours{background-image:linear-gradient(to right,#e0e0e0 1px,transparent 1px);background-size:calc(var(--hour-w) / 4) 5px;background-repeat:repeat-x;background-position:0 100%}
  .branch-head{grid-column:1/-1;padding:12px 0 6px;background:var(--surface2)}
  .branch-head .in{position:sticky;left:0;display:inline-flex;align-items:center;gap:10px;padding:0 12px}
  .bname{font-weight:700;font-size:13px;padding:1px 8px;border-radius:6px;color:#fff}
  .bwrap{position:relative;display:inline-block;margin-right:8px}
  .bwrap .badge{top:-8px;right:-10px}
  .vsum .bwrap .badge{min-width:16px;height:16px;line-height:16px;font-size:10px;top:-7px;right:-9px}
  /* ── r81 據點名牌：像素階梯角、兩店等寬、文字置中；分店色像素圖釘 ── */
  .np{--bc:#2F5E4A;box-sizing:border-box;width:124px;display:flex;align-items:center;gap:8px;height:26px;padding:0 11px 0 3px;background:var(--bc);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -2px 0 rgba(0,0,0,.30);clip-path:polygon(0 4px,2px 4px,2px 2px,4px 2px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px))}
  .np .ic{width:20px;height:20px;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(0 2px,2px 2px,2px 0,calc(100% - 2px) 0,calc(100% - 2px) 2px,100% 2px,100% calc(100% - 2px),calc(100% - 2px) calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,2px calc(100% - 2px),0 calc(100% - 2px))}
  .np .ic svg{display:block;animation:pinhop 3.2s steps(1) infinite}
  .np .nm{flex:1;font-family:var(--sans);font-size:15px;line-height:1;text-align:center;letter-spacing:3px;margin-right:-3px;white-space:nowrap;text-shadow:1px 1px 0 rgba(0,0,0,.35)}
  @keyframes pinhop{0%{transform:none}84%{transform:translateY(-2px)}90%{transform:translateY(-1px)}94%{transform:none}}
  /* ── r81 實時床位：方形區塊（跟本日量能同高 30px）＋左上角 live 綠燈＋r80 床縮 12px ── */
  .bd,.cap .qblk{height:30px;box-sizing:border-box;flex:none}
  .bd{position:relative;display:inline-flex;align-items:center;gap:7px;cursor:default;border:1px solid #CFC6BF;border-radius:3px;padding:0 9px 0 7px;background:rgba(255,255,255,.6)}
  .bd .ql,.cap .qblk .ql{font-family:var(--sans);font-size:10px;line-height:11px;color:#8a7a70;display:inline-flex;flex-direction:column;align-items:center;letter-spacing:1px;font-weight:400}
  .bd .sep,.cap .qblk .sep{width:1px;align-self:stretch;margin:5px 0;background:#DDD4CD;flex:none}
  .bd .row5{display:inline-flex;gap:1px;align-items:center}
  .bd .row5>span{display:block} .bd .row5 svg{width:12px;height:12px;display:block}
  .bd .row5 .on{color:var(--red)} .bd .row5 .off{color:#D6D0CB}
  .bd .lv{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#2a9d5c;box-shadow:0 0 0 1.5px var(--surface2);animation:lvb 1.6s ease-in-out infinite}
  .bd .lv::after{content:"";position:absolute;inset:0;border-radius:50%;animation:lvr 1.6s ease-out infinite}
  @keyframes lvb{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes lvr{0%{box-shadow:0 0 0 0 rgba(42,157,92,.5)}70%,100%{box-shadow:0 0 0 4px rgba(42,157,92,0)}}
  @media (prefers-reduced-motion:reduce){.bd .lv,.bd .lv::after,.np .ic svg{animation:none}}
  /* ── 量能儀表（紅天／綠天／黃金天） ── */
  .cap{--c:#C0392B;--gl:rgba(255,170,150,.9);display:inline-flex;align-items:center;gap:8px;margin-left:0;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .cap.wg{--c:#5DCAA5;--gl:rgba(255,255,255,.95)} .cap.hg{--c:#1A5C35;--gl:rgba(143,224,192,.9)} .cap.gold{--c:#E8960A;--gl:rgba(255,226,122,.95)}
  /* r82：大頭照外框用 pill 的鮮豔版 */
  .cap{--cv:#E8412E} .cap.wg{--cv:#2FC48D} .cap.hg{--cv:#1E8A55} .cap.gold{--cv:#F5A300}
  /* r80：像素 pill（22px 圓圈動畫，可溢出）→「本日／量能」方框 → 像素血條（canvas）→ 時數。顏色依《小泰空新制說明 v16》 */
  .cap .pill{display:inline-flex;align-items:center;gap:6px;border-radius:14px;padding:2px 10px 2px 2px;font-size:12px;font-weight:700;color:#fff;background:var(--c);letter-spacing:.3px;flex:none}
  /* r81：狀態字＝LED 發光點陣字，同一格輪播「前三字」⇄「後四字」（桌面／手機同一顆） */
  .cap .ptx{display:inline-grid;justify-items:center;height:16px;overflow:hidden;line-height:16px;min-width:4.6em;font-family:var(--sans);font-weight:400;font-size:12px;letter-spacing:1px;text-shadow:0 0 2px var(--gl),0 0 6px var(--gl)}
  .cap .ptx b{display:block;grid-area:1/1;font-weight:400;animation:txrot 4s steps(1) infinite}
  @keyframes txrot{0%{transform:none;opacity:1}46%{transform:translateY(-3px);opacity:.6}50%,100%{transform:translateY(16px);opacity:0}}
  @media (prefers-reduced-motion:reduce){.cap .ptx b{animation:none}.cap .ptx .p2{display:none}}
  /* r81：本日量能長方形區塊＝標題 │ 血條＋時數 │ 大頭照＋人數 */
  .cap .qblk{display:inline-flex;align-items:center;gap:9px;border:1px solid #CFC6BF;border-radius:3px;padding:0 10px 0 7px;background:rgba(255,255,255,.6)}
  .cap .qblk .hpn{min-width:0}
  .cap .qblk .ppl{padding-left:6px}
  .cap .qblk .ppl .cav{width:18px;height:18px;margin-left:-5px;border:2.5px solid var(--cv);font-size:9px}
  .cap .pnum{font-family:var(--sans);font-size:20px;line-height:1;font-weight:400;margin-left:-3px}
  .cap .pnum small{font-size:11px;margin-left:2px;color:var(--text-muted)}
  .cap .pnum.r{color:#8E2A1F} .cap .pnum.g{color:#1E7050} .cap .pnum.y{color:#B87400}
  .cap.wg .pill{color:#0F4D33}
  .cap .pic{width:22px;height:22px;border-radius:50%;background:#fff;position:relative;flex:none}
  .cap .pic svg{position:absolute;left:-2px;top:-2px;overflow:visible;pointer-events:none}
  .cap .qbox{font-family:var(--sans);font-size:10px;line-height:11px;color:#8a7a70;border:1px solid #CFC6BF;border-radius:3px;padding:2px 3px;display:inline-flex;flex-direction:column;align-items:center;letter-spacing:1px;flex:none;font-weight:400}
  .cap .hpc{display:block;flex:none;image-rendering:pixelated;margin:-6px -4px -2px 0}
  .cap .hpn{font-family:var(--sans);font-size:20px;line-height:1;min-width:66px;font-weight:400}
  .cap .hpn small{font-size:11px;margin-left:2px;color:var(--text-muted)}
  svg.px .f{opacity:0}
  @media (prefers-reduced-motion:reduce){svg.px .f{animation:none!important;opacity:0!important}svg.px .f0{opacity:1!important}}
  /* 上班老師頭像疊加（r80）：外框＝量能色；虛線空圈＝還差的人數；灰字＝總人數 */
  .cap .ppl{display:inline-flex;align-items:center;position:static;padding-left:5px}
  .cap .ppl .cav{position:relative;width:22px;height:22px;margin-left:-6px;border-radius:50%;border:1.5px solid var(--c);box-shadow:0 0 0 1.5px var(--surface);background:var(--surface2);overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-muted);flex:none}
  .cap .ppl .cav img{width:100%;height:100%;object-fit:cover;display:block}
  .cap .ppl .cav.need{border:1.5px dashed #C4C4C4;background:var(--surface);box-shadow:none}
  .cap .ppl .cav.more{border-color:#D2D2D2;font:500 9px var(--mono)}
  .cap .ppl .pcnt{margin-left:5px;font:500 11px var(--mono);color:var(--text-muted)}
  .cap .tag{font-size:10px;color:var(--text-muted);border:1px solid var(--border);padding:0 5px;border-radius:4px;font-family:var(--mono)}
  .cap .delta{font-family:var(--mono);font-size:11px;color:var(--red)}
  .cap.mini{margin-left:6px;gap:4px}
  .cap.mini .qblk{border:0;padding:0;background:none;gap:0;height:auto}
  .cap.mini .ql,.cap.mini .sep,.cap.mini .hpc,.cap.mini .ppl,.cap.mini .pnum,.cap.mini .tag,.cap.mini .delta{display:none}
  .cap.mini .hpn{font-size:13px;min-width:0}
  /* 量能說明框 */
  .cappop{display:none;position:fixed;z-index:60;width:300px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.14);padding:12px 14px;font-size:12px;line-height:1.55;color:var(--text)}
  .cappop .px{position:absolute;right:8px;top:8px;width:26px;height:26px;border:0;border-radius:50%;background:var(--surface2,#f1ece8);color:var(--text-muted,#6f625a);font-size:12px;line-height:26px;cursor:pointer;padding:0;z-index:2}
.cappop h4{padding-right:34px}
.cappop.open{display:block}
  .cappop h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:8px}
  .cappop .meter{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
  .cappop .meter .cap{margin:0;cursor:default;gap:6px} .cappop .meter .cap .pill{display:none}
  .cappop .meter .cap .ppl,.cappop .meter .cap .pnum,.cappop .meter .cap .sep2,.cappop .meter .cap .tag,.cappop .meter .cap .delta{display:none}
  .cappop .row{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text-muted);padding:2px 0}
  .cappop .row b{color:var(--text);font-weight:600}
  .cappop hr{border:0;border-top:1px solid var(--border2);margin:8px 0}
  .cappop p{margin:4px 0;color:var(--text-muted)}
  .cappop p b{color:var(--text)}
  .cappop .g{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .cappop .cutl{color:var(--red)}
  .row{display:contents}
  .row .who{position:sticky;left:0;z-index:10;background:var(--surface);height:var(--row-h);border-top:1px solid var(--border2);border-right:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 12px;white-space:nowrap}
  .row .who .rail{width:3px;height:28px;border-radius:2px;flex:none}
  .av{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-muted);flex:none;overflow:hidden;box-shadow:0 0 0 1px var(--border)}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .off .av{filter:grayscale(1);opacity:.55}
  .row .who .zh{font-weight:500;font-size:15px;flex:none}
  .row .who .en{font-family:var(--mono);font-size:11px;color:var(--text-hint);min-width:0;overflow:hidden;text-overflow:ellipsis}
  .row .who .tr{font-size:10px;color:#4E7A3E;border:1px solid #9DBB8E;padding:0 5px;border-radius:4px}
  .row .who .offlbl{font-size:11px;color:var(--text-hint)}
  .row .who .right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .avw{position:relative;display:inline-block;flex:none}
  .badge{position:absolute;top:-5px;right:-7px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--badge);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--surface);font-family:var(--sans)}
  .row .lane{position:relative;height:var(--row-h);border-top:1px solid var(--border2);background-color:var(--surface2);background-image:linear-gradient(to right,#dedede 1px,transparent 1px),linear-gradient(to right,#efefef 1px,transparent 1px);background-size:var(--hour-w) 100%,calc(var(--hour-w) / 4) 100%}
  .row.off .lane{background-color:#F5F5F5;background-image:repeating-linear-gradient(45deg,#E6E6E6 0 1px,transparent 1px 5px)}
  .shift{position:absolute;top:0;bottom:0;background-color:var(--surface);background-image:linear-gradient(to right,#e4e4e4 1px,transparent 1px),linear-gradient(to right,#f1f1f1 1px,transparent 1px);background-size:var(--hour-w) 100%,calc(var(--hour-w) / 4) 100%;background-position:var(--shift-off,0) 0;border-left:1px solid var(--border);border-right:1px solid var(--border)}
  .bk{position:absolute;top:6px;height:calc(var(--row-h) - 12px);border-radius:6px;padding:3px 7px;color:#2C2520;overflow:hidden;white-space:nowrap;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;line-height:1.15;transition:filter .12s;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
  .bk .l1{display:flex;align-items:center;gap:5px;min-width:0}
  .bk .num{font-family:var(--mono);font-size:12px;font-weight:700;background:rgba(0,0,0,.10);padding:0 5px;border-radius:4px;flex:none;line-height:16px}
  .bk .nm{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .bk .l2{display:flex;align-items:center;gap:5px}
  .bk.one{padding:3px 5px} .bk.one .l1{gap:4px} .bk.one .num{font-size:11px;padding:0 4px}
  .bk .dur{font-family:var(--mono);font-size:9px;background:rgba(255,255,255,.6);padding:0 4px;border-radius:3px;line-height:13px;flex:none}
  .bk:hover{filter:brightness(.93)}
  .bk:focus-visible,.bk.sel{outline:2px solid var(--badge);outline-offset:2px}
  .bk .t{font-family:var(--mono);font-size:10px;opacity:.75}
  .bk.d120{background:var(--d120)} .bk.d90{background:var(--d90)} .bk.d60{background:var(--d60)} .bk.trn{background:var(--tr)} .bk.free{background:var(--d90f)}
  .bk.past{opacity:.55}

  :root{--h2p:#E8590C;--hbd:#D6336C;--hcp:#1C7ED6}

  .hleg{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text-muted);white-space:nowrap}

  /* ── 直版（手機）：時間縱軸 × 老師欄 ── */

  .vbk{position:absolute;left:2px;right:2px;border-radius:6px;padding:4px 4px;color:#2C2520;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:1px;line-height:1.15;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}

  .vbk .t{font-family:var(--mono);font-size:9px;opacity:.75;white-space:nowrap}
  .vbk .c{font-size:11px;font-weight:700;word-break:break-all;overflow:hidden}
  .vbk .id{font-family:var(--mono);font-size:10px;font-weight:700;background:rgba(0,0,0,.10);border-radius:3px;padding:0 3px;align-self:flex-start}
  .vbk.d120{background:var(--d120)} .vbk.d90{background:var(--d90)} .vbk.d60{background:var(--d60)} .vbk.trn{background:var(--tr)} .vbk.free{background:var(--d90f)}
  .vbk.past{opacity:.55}
  .vbk.sel{outline:2px solid var(--badge);outline-offset:1px}
  .vbuf{position:absolute;left:2px;right:2px;background:rgba(120,100,90,.13);border-radius:0 0 5px 5px}
  .vblk{position:absolute;left:2px;right:2px;border-radius:5px;background:var(--blk);border:1px solid var(--blk-bdr);color:var(--text-muted);font-size:9px;display:flex;align-items:flex-start;padding:2px 3px;overflow:hidden;line-height:1.1}
  .vnow{position:absolute;left:0;right:0;height:1px;background:var(--red);z-index:15;pointer-events:none}
  .vnow::before{content:attr(data-t);position:absolute;left:2px;top:-8px;background:var(--red);color:#fff;font-family:var(--mono);font-size:9px;padding:0 4px;border-radius:3px;line-height:15px}

  .vsum::-webkit-scrollbar{display:none}

  .vsum{padding:5px 8px} .vsum .b{gap:4px} .vsum .bwrap{margin-right:15px}
  .vsum .np{width:88px;height:20px;padding:0 7px 0 2px;gap:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.30)} .vsum .np .ic{width:16px;height:16px} .vsum .np .nm{font-size:12px}
  .vsum .bd{height:22px;padding:0 6px;gap:5px} .vsum .bd .ql,.vsum .bd .sep{display:none} .vsum .bd .lv{box-shadow:0 0 0 1.5px var(--surface)}

  /* ── 顧客面板（overlay，預設收合） ── */
  .panel{position:fixed;top:0;right:0;bottom:0;z-index:40;width:var(--panel-w);max-width:100vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(0,0,0,.10);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s ease;visibility:hidden}

/* ═══ 專業化覆寫 v1 ═══ */
:root{--mono:'Manrope','Noto Sans TC',sans-serif;--sans:'Manrope','Noto Sans TC',-apple-system,system-ui,sans-serif;
  --ink:#1D1A18;--ink2:#6B625C;--ink3:#A39A93;--line:#EAE6E2}
body{font-variant-numeric:tabular-nums;letter-spacing:0}
.brand{font-weight:700;letter-spacing:-.01em}
.datenav .d b{font-weight:700}
/* ── 狀態 pill：淡底＋深字；像素圖示留在彩色圓章裡 ── */
.cap{--bg:#FBECE9;--fg:#8E2A1F;--bd:#F0C7BF}
.cap.wg{--bg:#E8F7F0;--fg:#14684A;--bd:#BDE5D3}
.cap.hg{--bg:#E6F1EA;--fg:#1A5C35;--bd:#B9D7C4}
.cap.gold{--bg:#FDF2DA;--fg:#855600;--bd:#F0D493}
.cap .pill{height:28px;padding:0 12px 0 1px;gap:8px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:999px;font-weight:700;letter-spacing:0}
.cap.wg .pill{color:var(--fg)}
.cap .pic{width:26px;height:26px;background:var(--c)}
.cap .pic::before{content:"";position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:50%;background:#fff}
.cap .pic svg{left:0;top:0}
.cap .ptx{display:inline-flex;align-items:baseline;gap:6px;height:auto;min-width:0;line-height:1;font-size:13px;font-weight:700;letter-spacing:.03em;text-shadow:none;overflow:visible}
.cap .ptx .pk{font-style:normal;font-size:10px;font-weight:600;opacity:.6;letter-spacing:.06em}
/* 本日量能：去掉方框 */
.cap{gap:12px}
.cap .qblk{border:0;background:none;padding:0;height:auto;gap:10px}
.cap .qblk .ql{flex-direction:row;font:500 12px var(--sans);color:var(--ink2);letter-spacing:0}
.cap .qblk .sep{height:14px;align-self:center;margin:0;background:#DDD6D0}
.cap .hpn{font:700 14px var(--sans);min-width:0;letter-spacing:0}
.cap .hpn small{font:500 11px var(--sans);color:var(--ink2);margin-left:1px}
.cap .pnum{font:700 14px var(--sans);margin-left:2px;letter-spacing:0}
.cap .pnum small{font:500 11px var(--sans)}
.cap .qblk .ppl .cav{width:20px;height:20px;border:2px solid var(--cv);font-size:9px}
.cap .hpc{margin:-6px -4px -2px 0}
.m{font:500 12px var(--sans);color:var(--ink2);white-space:nowrap} .m b{color:var(--ink);font-weight:700}
.bd2{display:inline-flex;align-items:center;gap:5px;font:500 12px var(--sans);color:var(--ink2);white-space:nowrap}
.bd2 b{color:var(--ink);font-weight:700} .bd2 em{font-style:normal;color:var(--ink3);margin-left:-3px}
.bd2 .lv{width:6px;height:6px;border-radius:50%;background:#2a9d5c;animation:lvb 1.6s ease-in-out infinite;flex:none}
/* ── 電腦：據點色塊橫幅 ── */
.branch-head{padding:14px 0 0;background:var(--surface2)}
.bband{background:var(--bc);color:#fff;height:28px;display:flex;align-items:center}
.bband .in{position:sticky;left:0;display:flex;align-items:center;gap:12px;padding:0 14px}
.bband .in b{font-size:13px;font-weight:700;letter-spacing:.1em}
.bband .bc{font-size:12px;font-weight:500;opacity:.92} .bband .bc i{font-style:normal;font-weight:700;margin-left:2px}
.bsub{position:sticky;left:0;display:inline-flex;align-items:center;gap:18px;padding:9px 14px 9px;background:transparent}
.row .who{padding:0 12px;gap:9px}
.row .who .rail{display:none}
.av{width:24px;height:24px;font-size:11px}
.row .who .zh{font-size:14px;font-weight:600}
.row .who .en{font:500 11px var(--sans);color:var(--ink3)}
.badge{min-width:15px;height:15px;line-height:15px;font-size:10px;top:-4px;right:-7px;padding:0 3px;box-shadow:0 0 0 1.5px var(--surface)}
/* ── 手機 ── */
.vsum{padding:0;gap:0;overflow:visible;align-items:stretch}
.vs{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.vs .bar{align-self:stretch;width:4px;background:var(--bc);flex:none;margin-right:2px}

.vs .cap .ptx{font-size:12px}
.vs .cap .hpn{font-size:13px}
.vs .hleg{padding:5px 10px}
.vband{position:sticky;top:var(--vsum-h,30px);z-index:22;height:22px;background:var(--bc);color:#fff}
.vband.c0{background:var(--surface);left:0;z-index:24;border-bottom:1px solid var(--line)}
.vband .in{position:sticky;left:36px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;height:22px}
.vband .in b{font-size:12px;font-weight:700;letter-spacing:.1em}
.vband .in i{font-style:normal;font:600 10px var(--sans);background:rgba(255,255,255,.24);border-radius:8px;padding:0 6px;line-height:15px}
.vhead{top:calc(var(--vsum-h,0px) + var(--vband-h,22px));padding:5px 2px 4px;gap:3px;min-height:0;justify-content:flex-start}
.vhead.corner{left:0;z-index:24;padding:0}
.vhead .av{width:20px;height:20px;font-size:10px}
.vhead .avw{margin-top:0}
.vhead .zh{font-size:11px;font-weight:600;white-space:nowrap}
.vhead .tr2{font-style:normal;font-size:8px;font-weight:700;color:#4E7A3E;border:1px solid #9DBB8E;border-radius:3px;padding:0 2px;margin-left:2px;vertical-align:1px}
.vhead .badge{min-width:14px;height:14px;line-height:14px;font-size:9px;top:-4px;right:-7px}
.vaxis .h{font:500 10px var(--sans);color:var(--ink3)}
.vhead.bstart,.vcol.bstart{border-left:1px solid #CFC8C2}
@media (max-width:700px){ :root{--col-w:46px} }

.vleg{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px 70px;font-size:11px;color:var(--ink2);background:var(--surface2);border-top:1px solid var(--line)}
.vleg span{display:inline-flex;align-items:center;gap:4px} .vleg small{color:var(--ink3);font-size:10px}

/* ═══ v3：預約條借用顧客檔案「到訪紀錄」卡的語彙 ═══
   底色＝原色 85% 調淺＋同色 76% 細邊；編號＝深色半透明小章（同到訪紀錄的日期章）；姓名副標；時間＋時長小字
   寬度由「欄寬」決定（container query）：夠寬＝橫排；窄＝英數右轉 90°、中文直排（writing-mode:vertical-rl） */
.vcol{container-type:inline-size;container-name:col}
.bk,.vbk{--kbg:#D1C2B3;color:#2C2520;box-shadow:none}
.bk.d120,.vbk.d120{--kbg:#CFB3B3}.bk.d90,.vbk.d90{--kbg:#D1C2B3}.bk.d60,.vbk.d60{--kbg:#EAD6C5}.bk.free,.vbk.free{--kbg:#EBE4C5}.bk.trn,.vbk.trn{--kbg:#C0D3B5}
.bk.d120,.bk.d90,.bk.d60,.bk.free,.bk.trn,.vbk.d120,.vbk.d90,.vbk.d60,.vbk.free,.vbk.trn{background:color-mix(in srgb,var(--kbg) 85%,#fff);border:1px solid color-mix(in srgb,var(--kbg) 76%,#fff)}
/* 電腦橫條 */
.bk{padding:3px 8px 3px 6px;border-radius:7px}
.bk .num{font:700 13px/15px var(--sans);background:rgba(0,0,0,.13);border-radius:5px;padding:2px 6px;letter-spacing:-.01em}
.bk.one .num{font-size:12px;padding:2px 5px}
.bk .nm{font:500 12px var(--sans)}
.bk .t{font:500 10px var(--sans);opacity:.85}
.bk .dur{font:500 10px var(--sans);background:rgba(255,255,255,.6);border-radius:4px;padding:0 5px;line-height:15px}
/* 手機直條：開始時間(1)＞顧客編號(2)＞姓名(3)；字級／字重／對比拉開層級，欄寬決定「保留多少字」而不是縮小或轉向
   學自「訪點佔比條」：極小字也易讀＝高對比＋短字串＋分級退化（全名→簡稱→只留數字） */
.vbk{padding:4px 5px 4px 6px;gap:3px;border-radius:7px}
.vbk .th{display:flex;align-items:center;gap:4px}
.vbk .t{font:800 11.5px/1.1 var(--sans);opacity:1;letter-spacing:-.01em;color:#1D1A18;font-variant-numeric:tabular-nums}
.vbk .vdur{display:none;font:600 9px var(--sans);background:rgba(255,255,255,.62);padding:0 4px;border-radius:4px;line-height:14px;align-self:auto}

.vbk .id s{text-decoration:none;font-weight:600;opacity:.55;margin-right:1px}
.vbk .c{font:500 11px/1.2 var(--sans);color:#5a4d45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal;max-width:100%}
.vbk.noid .c{font-size:13px;font-weight:800;color:#2C2520}
/* 寬（≥84）：時間大、時長膠囊、編號章加大 */
@container col (min-width:84px){ .vbk .vdur{display:inline-block} .vbk .t{font-size:13px} .vbk .id{font-size:15px;padding:3px 6px} .vbk .c{font-size:12.5px} }
/* 中（62–83）：維持上列；時間與編號章略縮 */
/* 窄（<62）：編號章退成純粗體數字（去掉 # 與底章）、姓名縮小，三行直排，不轉向 */
@container col (max-width:61px){
  .vbk{padding:3px 2px 3px 4px;gap:2px}
  .vbk .t{font-size:10.5px}
  .vbk .id{background:none;padding:0;font-size:12px;letter-spacing:-.04em}
  .vbk .id s{font-size:10.5px;opacity:.6;margin-right:0}
  .vbk .c{font-size:10px;font-weight:600}

}
/* 選用：窄欄直排（body.rot；時間仍橫排） */
@container col (max-width:61px){
  body.rot .vbk .vbody{flex:1;writing-mode:vertical-rl;gap:3px;max-width:none;max-height:100%}
  body.rot .vbk .id{background:rgba(0,0,0,.13);padding:5px 3px;font-size:14px} body.rot .vbk .id s{display:inline}
  body.rot .vbk .c{font-size:11.5px;letter-spacing:.1em;text-overflow:clip;max-width:none}
}
/* ═══ v4：量能狀態＋床位整合進據點色塊表頭（手機）；床位沿用上線版 icon 設計 ═══ */
.vsum:empty{display:none}
.vband{height:auto;min-height:24px;container-type:inline-size;container-name:band;top:var(--vsum-h,0px)}
.vband .in{position:sticky;left:34px;display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;padding:5px 8px;height:auto;width:max-content;max-width:min(100cqw,calc(100vw - 38px))}
.vband .bn{flex:1 0 auto;display:inline-flex;align-items:center;gap:6px}
.vband .bd{order:1;height:22px;padding:0 6px 0 7px;gap:5px;background:#fff;border-color:transparent}

.vband .bd .lv{left:-2px;top:-2px;box-shadow:0 0 0 1.5px var(--bc)}
.vband .cap{order:2;background:#fff;border-radius:999px;padding:1px 10px 1px 1px;gap:6px;margin:0}
.vband .cap .pill{background:none;border:0;padding:0;height:auto;gap:6px}
.vband .cap .pic{transform:scale(.85);transform-origin:left center;margin-right:-3px}
.vband .cap .ptx{font-size:12px} .vband .cap .ptx .pk{display:none}
.vband .cap .hpn{font-size:12px}
@container band (max-width:150px){ .vband .cap .ptx,.vband .cap .hpn{display:none} .vband .cap .pill{gap:0} .vband .cap{padding-right:1px} }

.vband .in{padding:4px 6px;gap:4px 6px}
.vband .bn{gap:4px} .vband .bn b{letter-spacing:.04em}
.vband .bd{padding:0 5px 0 6px;gap:4px}
.vband .bd .row5 svg{width:11px;height:11px}

/* ═══ v7：Apple 日曆式的細節 ═══ */

/* v8：長名字／英文名——姓名最多兩行，英文可在任意處斷行，超過才省略；點卡片看全名 */
.vbk .c{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:clip;overflow-wrap:anywhere;word-break:normal;line-height:1.15}

/* v9：姓名規則——中文：一行放得下就一行，超過依字斷成最多兩行；英文：只在空白斷詞，每個單字一行並以 … 省略，矮卡（<90 分）只留第一個單字；全名點開看 */
.vbk .c.lat{display:block;-webkit-line-clamp:unset;white-space:normal;overflow:visible;letter-spacing:-.01em}
.vbk .c.lat b{display:block;font-weight:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.vbk.sh .c.lat .w1{display:none}
/* 最窄（≤49px，十位老師）：四位數編號仍要完整，縮到 11px、左右留白再收 */
@container col (max-width:49px){
  .vbk{padding:3px 1px 3px 3px}

}

/* ═══ v10 ═══ */
:root{--axis-w:26px;--dk:#3A2D27;--h2p:#E8590C;--hbd:#D6336C;--hcp:#1C7ED6}
@media (max-width:700px){
 header{display:none}

 .vaxis .h{right:3px;font-size:9.5px}
}
.cnt{font-style:normal;display:inline-block;min-width:15px;height:15px;border-radius:8px;background:#DF4B3C;color:#fff;font:700 9.5px/15px var(--sans);text-align:center;padding:0 3px;box-shadow:0 0 0 1.5px #fff;flex:none}
/* 據點色塊＝兩行：名稱＋預約數（＋日期方塊）／狀態＋床位 */
.vband{background:var(--bc);color:#fff;height:auto;min-height:0;border-bottom:1px solid rgba(255,255,255,.16)}
.vband.c0{background:var(--dk);border-bottom-color:rgba(255,255,255,.1)}
.vband .in{position:sticky;left:var(--axis-w);display:block;width:min(100cqw,calc(100vw - var(--axis-w)));max-width:none;padding:4px 6px 4px;gap:0}
.vband .r1{display:flex;align-items:center;gap:5px;height:20px}
.vband .r1 b{font:700 12px var(--sans);letter-spacing:.02em;white-space:nowrap}
.vband .r2{display:flex;align-items:center;gap:4px;height:20px;margin-top:1px;white-space:nowrap}
.dblk{margin-left:auto;display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 4px 0 5px;background:var(--dk);color:#fff;border-radius:3px;border:0;cursor:pointer;white-space:nowrap}
.dblk b{font:700 11.5px var(--sans)} .dblk small{font:500 9.5px var(--sans);opacity:.8} .dblk i{font-style:normal;font-size:8px;opacity:.7}
.dblk.act::after{content:"";width:5px;height:5px;border-radius:50%;background:#FFB24A}
/* 狀態（深色底版）：去掉膠囊，只留像素圖示＋白字 */
.vband .cap{background:none;padding:0;border-radius:0;gap:5px;margin:0;order:0}
.vband .cap .pill{background:none;border:0;padding:0;height:auto;gap:2px;color:#fff}
.vband .cap .pic{transform:scale(.72);transform-origin:left center;margin-right:-7px}
.vband .cap .ptx{font:600 10.5px var(--sans);color:#fff;letter-spacing:0}
.vband .cap .ptx .pk{display:none}
.vband .cap .hpn{font:700 10.5px var(--sans);color:#fff!important}
.vband .cap .hpn small{font:500 9px var(--sans);color:rgba(255,255,255,.7);margin-left:0}
/* 床位（上線版床 icon，去掉大方框；深色底：占用＝白、空＝淡白） */
.bd3{display:inline-flex;align-items:center;gap:1px;margin-left:auto;position:relative;padding-left:6px}
.bd3 .lv{position:absolute;left:0;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:#7CFFB2;animation:lvb 1.6s ease-in-out infinite}
.bd3 span{width:9px;height:9px;display:block}.bd3 svg{width:100%;height:100%;display:block}
.bd3 .on{color:#fff}.bd3 .off{color:rgba(255,255,255,.3)}
@container band (max-width:170px){ .vband .cap .ptx{display:none} }
/* 老師表頭上據點底色 */
.vhead{background:var(--bc,var(--dk));color:#fff;border-bottom:0;top:calc(var(--vsum-h,0px) + var(--vband-h,44px));padding:5px 0 4px;gap:2px}
.vhead.corner{background:var(--dk)}
.vhead .zh{color:#fff;font:600 10.5px var(--sans)}
.vhead .tr2{color:#fff;border-color:rgba(255,255,255,.65)}
.vhead .av{box-shadow:0 0 0 1.5px rgba(255,255,255,.65)}
.vhead.bstart{border-left:1px solid rgba(255,255,255,.5)}
.vhead .badge{background:#DF4B3C;min-width:15px;height:15px;line-height:15px;font-size:9.5px;top:-5px;right:-8px;padding:0 3px;box-shadow:0 0 0 1.5px #fff}
/* 預約條：小圓角、標頭放開始時間 */
.vbk{border-radius:3px;padding:0;gap:0;left:2px;right:2px}
.vbk .th{display:flex;align-items:center;gap:4px;padding:3px 5px;min-height:17px}
.vbk .vbody{padding:3px 5px 4px}
.vbk .t{font:800 11.5px/1.1 var(--sans);display:inline-flex;gap:0;letter-spacing:-.01em}
.tv1 .vbk .th{background:rgba(0,0,0,.15)} .tv1 .vbk .t{color:#1d1a18}
.tv2 .vbk .th{background:color-mix(in srgb,var(--kbg) 34%,#241913)} .tv2 .vbk .t{color:#fff} .tv2 .vbk .vdur{background:rgba(255,255,255,.22);color:#fff}
.tv3 .vbk .th{background:none;padding:3px 4px 0} .tv3 .vbk .t{background:rgba(0,0,0,.16);border-radius:2px;padding:1px 4px}
.vbk .id{font-variant-numeric:tabular-nums}
.vbk .id .n1,.vbk .id .n2{display:inline}
@container col (min-width:84px){ .vbk .t{font-size:13px} }
@container col (max-width:49px){ .vbk .th{padding:2px 3px} .vbk .vbody{padding:2px 3px 3px} .vbk .t{font-size:10px} }
/* 提醒色框：改用 outline（畫在標頭上方，不被標頭條蓋住） */
button.hx-2p,button.hx-bd,button.hx-cp{box-shadow:none;outline-offset:-2.5px}
button.hx-2p{outline:2.5px solid var(--h2p)} button.hx-bd{outline:2.5px solid var(--hbd)} button.hx-cp{outline:2.5px solid var(--hcp)}
button.hx-cp.hx-2p{outline:2.5px solid var(--h2p);outline-offset:-2.5px;box-shadow:0 0 0 2.5px var(--hcp)}
button.hx-cp.hx-bd{outline:2.5px solid var(--hbd);outline-offset:-2.5px;box-shadow:0 0 0 2.5px var(--hcp)}
.vbk.sel{outline:2px solid #DF4B3C!important;outline-offset:1px!important}

#dp_ppl .grp{display:inline-block;font-size:10px;color:#fff;padding:1px 7px;border-radius:4px;margin:6px 0 2px}
#dp_ppl .av{width:20px;height:20px;font-size:9px}
#dp_ppl .off{opacity:.5}

/* 修：舊規則 .vband .in i 會把小圖示撐成膠囊 */
.vband .dblk i{background:none;padding:0;line-height:1;border-radius:0}
.vband .bd3 .lv{padding:0;background:#7CFFB2;border-radius:50%;width:4px;height:4px;line-height:0}

/* ═══ v11 ═══ */
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* 字重四檔：fw0 極輕／fw1 輕／fw2 中（預設）／fw3 重（v10） */
body.fw0{--fwt:400;--fwn:500;--fwm:300;--fwb:300;--fwh:400;--fwz:400}
body.fw1{--fwt:500;--fwn:600;--fwm:400;--fwb:400;--fwh:500;--fwz:500}
body.fw2{--fwt:600;--fwn:700;--fwm:400;--fwb:500;--fwh:600;--fwz:500}
body.fw3{--fwt:800;--fwn:800;--fwm:600;--fwb:600;--fwh:700;--fwz:600}
/* 1 預約數紅圈：據點與老師同一款（先前被舊規則 .vband .in i 蓋成半透明） */
.vband .in i.cnt,.vhead .badge{background:#DF4B3C;color:#fff;min-width:15px;height:15px;border-radius:8px;padding:0 3px;font:700 9.5px/15px var(--sans);text-align:center;box-shadow:0 0 0 1.5px #fff;font-style:normal;letter-spacing:0}
.vband .in i.cnt{display:inline-block;flex:none}
/* 2 日期／篩選：左上角直式日曆方塊（跨兩列表頭） */
.vband.c0{grid-row:span 2;position:sticky;top:var(--vsum-h,0px);left:0;z-index:26;background:var(--dk);border:0;padding:0}
.dtile{width:100%;height:100%;margin:0;padding:3px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:none;border:0;color:#fff;cursor:pointer;position:relative;border-radius:0}
.dtile b{font:700 11px/1.05 var(--sans)}
.dtile hr{width:12px;height:1px;border:0;background:rgba(255,255,255,.4);margin:1px 0}
.dtile .wk{writing-mode:vertical-rl;font:500 9.5px/1 var(--sans);opacity:.85;margin-top:2px;letter-spacing:.04em}
.dtile i{font-style:normal;font-size:7px;opacity:.7;margin-top:3px;padding:0;background:none;line-height:1}
.dtile.act::after{content:"";position:absolute;right:3px;top:4px;width:5px;height:5px;border-radius:50%;background:#FFB24A}
/* 3 預約條整體感：標頭與內文同色系，只深一點點；時間靠字重取勝 */
.tv1 .vbk .th{background:color-mix(in srgb,var(--kbg) 88%,#000);color:#1d1a18}
.tv1 .vbk .t{color:#1d1a18} .tv1 .vbk .vdur{background:rgba(255,255,255,.55);color:#3a2f29}
.tv4 .vbk .th{background:none;border-bottom:1px solid rgba(0,0,0,.13)} .tv4 .vbk .t{color:#1d1a18} .tv4 .vbk .vdur{background:rgba(255,255,255,.55);color:#3a2f29}
.tv3 .vbk .th{background:none;padding:3px 4px 0} .tv3 .vbk .t{background:rgba(0,0,0,.14);border-radius:2px;padding:1px 4px;color:#1d1a18}
/* 5 字級字重：極小字用較輕的字重（同訪點佔比條：400 / 小字級） */
.vbk .t{font-weight:var(--fwt)} .vbk .id{font-weight:var(--fwn)} .vbk .c{font-weight:var(--fwm);color:#3a2f29}
.vbk .id s{font-weight:var(--fwz);opacity:.55}
.vband .cap .ptx{font-weight:var(--fwb)} .vband .cap .hpn{font-weight:var(--fwh)} .vband .cap .hpn small{font-weight:var(--fwb)}
.vhead .zh{font-weight:var(--fwz)}

.vbk .id{display:block;white-space:nowrap}
.vbk .id .n1,.vbk .id .n2{display:inline}
.vbk .c,.vbk .c.lat,.vbk .c.cjk{display:block;-webkit-line-clamp:unset;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.2}
@container col (min-width:42px) and (max-width:61px){
 .vbk .t{font-size:10.5px} .vbk .id{font-size:12px;background:none;padding:0} .vbk .id s{font-size:10px;display:inline} .vbk .c{font-size:10px}

@container col (min-width:42px) and (max-width:49px){
 .vbk{left:1px;right:1px} .vbk .th{padding:2px 3px} .vbk .vbody{padding:2px 3px 3px}
 .vbk .t{font-size:10px;letter-spacing:-.02em} .vbk .id{font-size:10.5px;letter-spacing:-.04em} .vbk .id s{font-size:9px} .vbk .c{font-size:9.5px}

 .vbk{left:1px;right:1px}
 .vbk .th{padding:2px 1px;justify-content:center;min-height:0}
 .vbk .t{font-size:9.5px;letter-spacing:-.04em;flex-direction:row}
 .vbk .vbody{flex:1;min-height:0;writing-mode:vertical-rl;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:3px 2px 3px 3px;max-width:none}
 .vbk .id{background:none;padding:0;font-size:10.5px;line-height:1;letter-spacing:-.02em;max-height:100%}
 .vbk .id s{display:inline;font-size:9px}
 .vbk .c,.vbk .c.lat,.vbk .c.cjk{font-size:9.5px;line-height:1;letter-spacing:.04em;max-height:100%;max-width:none}
 .hbub{min-width:13px;height:13px;line-height:13px;font-size:8px;padding:0 2px}
 .hbub svg{width:9px;height:9px}
}

/* ═══ v12 ═══ */
:root{--axis-w:30px}
/* 預約開始時間字重＝顧客編號 */
.vbk .t{font-weight:var(--fwn)}
/* 轉向後英文被切（y、g 的下伸筆畫被行框裁掉）：行高放寬＋允許筆畫外溢 2–3px，字稍縮以保住寬度 */
@container col (max-width:41px){
 .vbk .vbody{gap:1px;padding:3px 1px 3px 2px}
 .vbk .id{font-size:10px}
 .vbk .c,.vbk .c.lat,.vbk .c.cjk{font-size:9px;line-height:1.25;overflow:clip;overflow-clip-margin:3px}
}
/* 日期方塊：日曆頁（月／日／週幾）＋ ▾，看得出能點 */
.vband.c0{background:var(--dk)}
.dtile{padding:5px 0 3px;gap:4px;justify-content:flex-start}
.dtile .cal{width:24px;border-radius:4px;overflow:hidden;background:#F7F3EF;display:flex;flex-direction:column;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.dtile .mo{display:block;width:100%;background:#AE6C56;color:#fff;font:600 9.5px/12px var(--sans);text-align:center}
.dtile .dy{display:block;font:800 17px/21px var(--sans);color:#2B211C}

/* ═══ v13 ═══ */

.vband .cap .pic{position:absolute;left:0;top:0;margin:0;transform:scale(.85);transform-origin:0 0}

/* 老師預約數紅圈：不被相鄰格／上方色塊蓋住（z-index 已由程式依欄序遞減），密集時收進格內避免右緣被切 */
.vhead{overflow:visible}
.vgrid.dense .vhead .av{width:18px;height:18px}

/* 密集時培訓標記：收成頭像左下的小綠圓「培」（與右上紅圈對稱），避免名字被擠成重疊 */

/* ═══ v14 ═══ */
/* 左上角日曆：平日／假日類配色、節日小章、獎金日徽章、明確的「調整」按鈕 */
.dtile{padding:4px 0 4px;gap:3px;justify-content:flex-start;align-items:center}
.dtile .cal{position:relative;width:24px;border-radius:4px;background:#F7F3EF;box-shadow:0 1px 2px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:stretch;overflow:hidden}
.dtile .mo{display:block;background:#AE6C56;color:#fff;font:600 9px/10px var(--sans);text-align:center;border-radius:4px 4px 0 0}
.dtile .dy{display:block;font:800 16px/17px var(--sans);color:#2B211C;text-align:center}
.dtile .wk2{display:block;font:600 9px/10px var(--sans);color:#4a403a;text-align:center;padding-bottom:1px}
.dtile.rd .mo{background:#C0392B}
.dtile.rd .wk2{color:#C0392B}
.dtile.rd .dy{color:#C0392B}

.stamp.k-off{background:#C0392B}.stamp.k-event{background:#7B5EA7}.stamp.k-memo{background:#3E7C86}
.dtile .tapb{display:block;margin-top:auto;width:26px;height:14px;border-radius:7px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.55);color:#fff;font:600 9px/12px var(--sans);text-align:center;letter-spacing:0;position:relative}
.dtile.act .tapb::after{content:"";position:absolute;right:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:#FFB24A;box-shadow:0 0 0 1.2px #3A2D27}
.dtile.act::after{display:none}
.dtile i{display:none}
.dtile:active .tapb{background:rgba(255,255,255,.4)}
/* 彈出面板：今日資訊標籤 */
#dpop .dpi2{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
#dpop .chip{padding:3px 9px;border-radius:5px;font:600 11px var(--sans);color:#fff;background:rgba(255,255,255,.14)}
#dpop .chip.hol{background:#C0392B}#dpop .chip.k-off{background:#C0392B}#dpop .chip.k-event{background:#7B5EA7}#dpop .chip.k-memo{background:#3E7C86}
#dpop .chip.bonus{background:#F5B52A;color:#3d2a00}
.dtile .bzs{display:block;background:#F5B52A;color:#3d2a00;font:700 8.5px/10px var(--sans);text-align:center;letter-spacing:0}

/* ═══ v15 ═══ */
/* 左上角日期＝整格奶油色「日曆卡」，高度永遠由表頭決定（contain:size），內容不會撐高表頭 */
.vband.c0{background:#F7F3EF;contain:size;overflow:hidden;border:0;padding:0}
.dtile{width:100%;height:100%;margin:0;padding:0;gap:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;background:none;border:0;border-radius:0;color:#2B211C;cursor:pointer;position:relative;overflow:hidden}
.dtile .mo{display:block;background:#AE6C56;color:#fff;font:600 9px/11px var(--sans);text-align:center}
.dtile .dy{display:block;font:800 17px/18px var(--sans);color:#2B211C;text-align:center}
.dtile .wk2{display:block;font:600 9px/10px var(--sans);color:#4a403a;text-align:center}
.dtile.rd .mo{background:#C0392B}.dtile.rd .dy,.dtile.rd .wk2{color:#C0392B}
.dtile .stamp{display:block;width:26px;margin:1px auto 0;padding:1px 0;border-radius:3px;font:600 8px/8.5px var(--sans);text-align:center;color:#fff}
.stamp.k-off{background:#C0392B}.stamp.k-event{background:#7B5EA7}.stamp.k-memo{background:#3E7C86}
/* 特殊獎金日＝整張日曆卡外圈金框（不佔高度） */
.dtile.bz{box-shadow:inset 0 0 0 2.5px #F5B52A}
/* 可點擊提示：底部深色膠囊＋明顯的下拉箭頭（不再有「調整」字樣） */
.dtile .chev{position:absolute;left:50%;bottom:2px;margin-left:-11px;width:22px;height:10px;border-radius:6px;background:#3A2D27;display:flex;align-items:center;justify-content:center}
.dtile .chev svg{width:10px;height:6px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dtile.act .chev::after{content:"";position:absolute;right:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:#FF8A00;box-shadow:0 0 0 1.2px #F7F3EF}
.dtile:active .chev{background:#6b4f43}
.dtile .tapb,.dtile i,.dtile .cal{display:none}
.dtile.act::after{display:none}

/* ═══ v16 ═══ */
/* 左上角：回到深棕底＋奶油色日曆頁；高度仍由表頭決定（contain:size），恆 75px */
.vband.c0{background:var(--dk);contain:size;overflow:hidden}
.dtile{color:#fff;align-items:center;padding:4px 0 0}
.dtile .cal{display:flex;flex-direction:column;width:24px;border-radius:4px;overflow:hidden;background:#F7F3EF;box-shadow:0 1px 2px rgba(0,0,0,.45);flex:none}
.dtile .cal .mo{display:block;background:#AE6C56;color:#fff;font:600 9px/10px var(--sans);text-align:center}
.dtile .cal .dy{display:block;font:800 16px/16px var(--sans);color:#2B211C;text-align:center}
.dtile .cal .wk2{display:block;font:600 9px/10px var(--sans);color:#4a403a;text-align:center}
.dtile.rd .cal .mo{background:#C0392B}.dtile.rd .cal .dy,.dtile.rd .cal .wk2{color:#C0392B}
.dtile.bz{box-shadow:none}
.dtile .stamp{margin:3px auto 0;width:26px}
.stamp.k-bonus{background:#F5B52A;color:#3d2a00;font-weight:800;font-size:8.5px;letter-spacing:-.02em}
.dtile .chev{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.55);box-sizing:border-box}
.dtile.act .chev::after{box-shadow:0 0 0 1.2px #3A2D27;right:-4px;top:-4px}
.dtile:active .chev{background:rgba(255,255,255,.4)}
/* 小章與箭頭膠囊之間留 3px（日曆頁與小章各收 1px） */
.dtile{padding-top:3px}
.dtile .cal .dy{line-height:15px}
.dtile .stamp{margin-top:2px}

/* ═══ v17 ═══ */
/* 右轉（欄寬<42px）時，顧客編號也加圓角深色底章（同寬版的編號章） */

}

/* ═══ v18 ═══ */
/* 說明泡泡（沿用顧客檔案系統 #kxtip 樣式） */
#kxtip{position:fixed;z-index:2000;width:320px;max-width:calc(100vw - 16px);background:#fff;color:#2C2520;border:1px solid #E8DDD6;border-radius:14px;padding:12px 14px;font:13px/1.5 'Manrope','Noto Sans TC',sans-serif;box-shadow:0 12px 34px rgba(0,0,0,.24);display:none}

#kxtip h5 .tdot{width:10px;height:10px;border-radius:50%;background:var(--tc);flex:none}
#kxtip .lead{background:#F7F2EE;border-radius:9px;padding:7px 10px;font-size:12.5px;color:#5C4A3F;margin:0 0 9px}

#kxtip .kx-tx{position:absolute;right:8px;top:8px;width:26px;height:26px;border:0;border-radius:50%;background:rgba(255,255,255,.75);color:#6F625A;font-size:12px;line-height:26px;cursor:pointer;padding:0;z-index:2}
/* 釘選提醒（新）：色框＋圓泡泡，與壽星／同行／再訪同一套；由內而外＝方案框 → 同行框 → 釘選框 */
:root{--hpin:#E0A010}
.hbub{pointer-events:auto;cursor:pointer}
.hbub.hpin{background:var(--hpin);color:#3d2f04}
.hbub.h2p,.hbub.hbd,.hbub.hcp{cursor:pointer}
button.hx-pin{box-shadow:none;outline:2.5px solid var(--hpin);outline-offset:-2.5px}
button.hx-pin.hx-2p,button.hx-pin.hx-bd{outline:2.5px solid var(--h2p);box-shadow:0 0 0 2.5px var(--hpin)}
button.hx-pin.hx-bd{outline-color:var(--hbd)}
button.hx-pin.hx-cp:not(.hx-2p):not(.hx-bd){outline:2.5px solid var(--hcp);box-shadow:0 0 0 2.5px var(--hpin)}
button.hx-pin.hx-cp.hx-2p{outline:2.5px solid var(--h2p);box-shadow:0 0 0 2.5px var(--hcp),0 0 0 5px var(--hpin)}
button.hx-pin.hx-cp.hx-bd{outline:2.5px solid var(--hbd);box-shadow:0 0 0 2.5px var(--hcp),0 0 0 5px var(--hpin)}
/* 床位可點 */
.bd3,.bd{cursor:pointer}
/* 時間軸上的提示小圓圈：不論欄數，一律用 12 欄最小版 */
.hbub{min-width:13px;height:13px;line-height:13px;font-size:8px;padding:0 2px;box-shadow:0 0 0 1.5px var(--surface)}
.hbub svg{width:9px;height:9px}

@keyframes cxrot{0%{transform:none;opacity:1}46%{transform:translateY(-4px);opacity:.55}50%,100%{transform:translateY(28px);opacity:0}}
@media (prefers-reduced-motion:reduce){.led b{animation:none}.led .p2{display:none}}

.dt{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}.dt.r{background:#E5533F}.dt.wg{background:#4CC9A0}.dt.gd{background:#F0A21A}

// r81 據點名牌：分店色像素地圖圖釘（字元圖 → 1:1 像素 SVG）

 let s='';for(const y in byRow){const a=byRow[y].sort((p,q)=>p[0]-q[0]);let i=0;while(i<a.length){let j=i;while(j+1<a.length&&a[j+1][0]===a[j][0]+1&&a[j+1][1]===a[i][1])j++;s+='<rect x="'+a[i][0]+'" y="'+y+'" width="'+(a[j][0]-a[i][0]+1)+'" height="1" fill="'+P[a[i][1]]+'"/>';i=j+1;}}return s;}

async function loadTimeline(dk, retry=true){
  const token = await getToken();
  if(!token){ if(retry){ _forceTok=true; await new Promise(r=>setTimeout(r,800)); return loadTimeline(dk,false); } throw Object.assign(new Error('noauth'),{noauth:true}); }
  const r = await fetch(`${SB_URL}/functions/v1/timeline?date=${dk}`, { headers:{ Authorization:`Bearer ${token}`, apikey: SB_ANON } });
  if(r.status===401){ if(retry){ _forceTok=true; return loadTimeline(dk,false); } throw Object.assign(new Error('noauth'),{noauth:true}); }  // 主系統可能正在刷新 token
  if(r.status===403) throw Object.assign(new Error('forbidden'),{forbidden:true});
  if(!r.ok) throw new Error(`timeline ${r.status}`);
  const j = await r.json();
  if(j.buffer) BUFFER = j.buffer;
  j.teachers.forEach(t=>{
    t.events = (t.events||[]).map(ev=>({ ...ev, s:isoToH(ev.start,dk), e:isoToH(ev.end,dk) })).filter(ev=>{
      if(ev.allDay) return false;                              // 整天型（休假）不畫，排休由排班表決定
      if(ev.kind==='block' && (ev.e-ev.s)>=20) return false;   // 24 小時型占用同上
      return ev.e > OPEN && ev.s < CLOSE;
    });
  });
  try{ await annotateHints(j, dk); }catch(e){ console.warn('hints', e); }
  return j;
}

/* ── 提醒（r79）── 依紀錄推測，以櫃台確認為準；查詢失敗就不顯示，不影響時間軸本體
   當月2+ ：非培訓的 120 分預約（老師非培訓、標題無「培訓」、有編號），同月在這筆之前已有 120 分紀錄（或同日時間軸上更早的 120 分）
   本月壽星：同上條件但本月還沒做過 120 分，且生日在本月（資料：沒做過→用壽星 165 筆；做過→用 2+）。兩者互斥
   同行   ：同分店、同開始時間、不同老師，且 ①同編號／同名字（同帳號）或 ②過去紀錄互為同行（records.companions） */
const HINT_SVG={
  nw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10" cy="8" r="3.4"/><path d="M3.5 20c0-3.4 2.9-5.8 6.5-5.8"/><path d="M18 13v7M14.5 16.5h7"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 6 3.2 3.2H6.8L10 9z"/><path d="M12 12.5V21"/></svg>',
  cp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.2 2.4-5.5 5.5-5.5s5.5 2.3 5.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6c2.4.3 4 2.2 4 5"/></svg>',
  bd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z"/><path d="M4 15.5c1.3 1 2.7 1 4 0s2.7-1 4 0 2.7 1 4 0 2.7-1 4 0"/><path d="M12 11V8"/><path d="M12 3.5c.9 1 .9 2.2 0 3-.9-.8-.9-2 0-3z"/></svg>',
};
const HINT_LBL={ '2p':'當月再訪', bd:'本月壽星', cp:'同行', nw:'可能是新朋友', pin:'釘選提醒' };
const KTMAP={'2p':'p2',bd:'bd',cp:'cp',nw:'nw',pin:'pin'};
const hbub = k => `<span class="hbub h${k}" data-kt="${KTMAP[k]}">${k==='2p'?'2+':HINT_SVG[k]}</span>`;
const hintKeys = ev => [ev.cp?'cp':null, ev.plan||null, ev.nw?'nw':null, ev.pin?'pin':null].filter(Boolean);   // 同行在前、方案在後
const hintCls = ev => hintKeys(ev).map(k=>'hx-'+k).join(' ');
const hintTitle = ev => ev.hintWhy?.length ? `\n${ev.hintWhy.join('\n')}（推測，以櫃台確認為準）` : '';
const hmOf = h => { const m=Math.round(h*60); return `${pad(Math.floor(m/60))}:${pad(m%60)}`; };
const mdOf = d => d.slice(5).replace('-','/');
async function annotateHints(j, dk){
  const bks=[];
  j.teachers.forEach(t=>t.events.forEach(ev=>{ if(ev.kind==='booking') bks.push({ev,t}); }));
  // 同行候選：同分店＋同開始時間＋不同老師
  const groups={}; bks.forEach(b=>{ (groups[b.t.branch+'|'+b.ev.start] ||= []).push(b); });
  const multi=Object.values(groups).filter(g=>new Set(g.map(b=>b.t.staffId)).size>1);
  const planC=bks.filter(({ev,t})=>!t.isTrainee && !/培訓/.test(ev.title||'') && ev.customerNum && durOf(ev)===120);   // 培訓老師或以培訓價預約的不適用
  const numsP=[...new Set(planC.map(b=>b.ev.customerNum))];
  const numsC=[...new Set(multi.flat().map(b=>b.ev.customerNum).filter(Boolean))];
  const monthStart=`${dk.slice(0,7)}-01`;
  const numsAll=[...new Set(bks.map(b=>b.ev.customerNum).filter(Boolean))];
  const [cs,rs,hist,pins]=await Promise.all([
    numsP.length?rest(`customers?select=num,birthday&num=in.(${numsP.join(',')})`):[],
    numsP.length?rest(`records?select=customer_num,date,start_time,duration&customer_num=in.(${numsP.join(',')})&duration=eq.120&date=gte.${monthStart}&date=lte.${dk}&is_draft=eq.false&limit=2000`):[],
    numsC.length>1?rest(`records?select=customer_num,companions&customer_num=in.(${numsC.join(',')})&companions=not.is.null&limit=2000`):[],
    numsAll.length?rest(`customer_notes?select=customer_num&pinned=eq.true&customer_num=in.(${numsAll.join(',')})&limit=2000`).catch(()=>[]):[],
  ]);
  const pinSet=new Set(pins.map(p=>p.customer_num)); bks.forEach(({ev})=>{ if(ev.customerNum&&pinSet.has(ev.customerNum)) ev.pin=true; if(!ev.customerNum) ev.nw=true; });
  // 當月2+／本月壽星（互斥，2+ 優先）
  const bday={}; cs.forEach(c=>{ const m=String(c.birthday||'').match(/^\d{4}[\/-](\d{1,2})[\/-](\d{1,2})$/); if(m) bday[c.num]={m:+m[1],d:+m[2]}; });
  const mon=+dk.slice(5,7);
  planC.forEach(({ev})=>{
    const startHM=hmOf(ev.s-1);   // 同日紀錄需早於本筆 1 小時以上，避免把本筆自己的紀錄算進去
    const prior=rs.filter(r=>r.customer_num===ev.customerNum && (r.date<dk || (r.date===dk && ev.s<24 && String(r.start_time||'').slice(0,5)<startHM)))
                  .sort((a,b)=>a.date<b.date?-1:1);
    const priorTl=planC.find(o=>o.ev!==ev && o.ev.customerNum===ev.customerNum && o.ev.s<ev.s);
    ev.hintWhy=[];
    if(prior.length || priorTl){ ev.plan='2p'; ev.hintWhy.push(`當月2+：本月 ${prior.length?prior.map(r=>mdOf(r.date)).join('、'):mdOf(dk)+' '+fmt(priorTl.ev.s)} 已做過 120 分`); }
    else if(bday[ev.customerNum]?.m===mon){ ev.plan='bd'; ev.hintWhy.push(`本月壽星：生日 ${pad(bday[ev.customerNum].m)}/${pad(bday[ev.customerNum].d)}`); }
  });
  // 同行：同組內用 union-find 連起「同帳號」與「過去互為同行」
  const pairs=new Set(); hist.forEach(r=>(r.companions||[]).forEach(o=>{ pairs.add(r.customer_num+'-'+o); pairs.add(o+'-'+r.customer_num); }));
  const idKey=ev=>ev.customerNum?'#'+ev.customerNum:'n:'+String(ev.displayName||'').trim().toLowerCase();
  multi.forEach(g=>{
    const par=g.map((_,i)=>i); const find=i=>par[i]===i?i:(par[i]=find(par[i]));
    const why=g.map(()=>new Set());
    for(let a=0;a<g.length;a++) for(let b=a+1;b<g.length;b++){
      if(g[a].t.staffId===g[b].t.staffId) continue;
      const A=g[a].ev, B=g[b].ev;
      const same = idKey(A)===idKey(B) && idKey(A)!=='n:';
      const past = A.customerNum && B.customerNum && pairs.has(A.customerNum+'-'+B.customerNum);
      if(same||past){ par[find(a)]=find(b); const w=same?'同帳號':'曾一起來過'; why[a].add(w); why[b].add(w); }
    }
    const comp={}; g.forEach((_,i)=>{ (comp[find(i)] ||= []).push(i); });
    Object.values(comp).filter(c=>c.length>1).forEach(c=>c.forEach(i=>{
      const {ev}=g[i]; const others=c.filter(k=>k!==i).map(k=>g[k].t.name.split(' ')[0]);
      ev.cp={ size:c.length, others };
      (ev.hintWhy ||= []).unshift(`同行：與 ${others.join('、')} 同時段（${[...why[i]].join('、')}）`);
    }));
  });
}

/* 直版（手機）：只列「有上班」的老師成欄；排休老師列在最下方一行 */
function renderVertical(){
  const HOUR_H=64;
  const y = h => (h - OPEN) * HOUR_H;
  const isToday = dateKey===todayKey(), NOW=nowH();
  const cols=[]; const offs=[];
  visibleBranches().forEach(br=>{
    const list=data.teachers.filter(t=>t.branch===br.name);
    list.forEach((t,i)=>{ if(!t.shift && !t.events.some(e=>e.kind==='booking')){ if(isShown(t)) offs.push({t,br}); return; }
      if(isShown(t)) cols.push({t,br,first:cols.length && cols[cols.length-1].br!==br}); });
  });
  const totalH=(CLOSE-OPEN)*HOUR_H;
  const grid=document.createElement('div'); grid.className='vgrid'; grid.style.setProperty('--ncol',Math.max(1,cols.length)); grid.classList.toggle('dense',(board.clientWidth-30)/Math.max(1,cols.length)<42);
  // 分店摘要（床位 / 預約數）
  const sum=document.createElement('div'); sum.className='vsum';
  sum.innerHTML=''; const _unused=()=>visibleBranches().map(br=>{ const list=data.teachers.filter(t=>t.branch===br.name);
    const c=list.reduce((n,t)=>n+bookingCount(t),0);
    return `<span class="b">${nameplate(br,c,true)}${bedsHtml(bedsNow(list,isToday,NOW))}${capHtml(br.name,true)}</span>`; }).join('')
    + (anyHints()?`<span class="hleg">${hintLegendHtml()}</span>`:'');
  // 表頭
  const groups=[]; cols.forEach(({br})=>{ const g=groups[groups.length-1]; if(g&&g.br===br) g.n++; else groups.push({br,n:1}); });
  const c0=document.createElement('div'); c0.className='vband c0'; c0.innerHTML=dateBlockHtml(); grid.appendChild(c0);
  groups.forEach((g,gi)=>{ const cnt=data.teachers.filter(t=>t.branch===g.br.name).reduce((n,t)=>n+bookingCount(t),0);
    const b=document.createElement('div'); b.className='vband'; b.style.gridColumn='span '+g.n; b.style.setProperty('--bc',g.br.hex);
    const bl=data.teachers.filter(t=>t.branch===g.br.name); const used=bedsNow(bl,isToday,NOW);
    b.innerHTML=`<span class="in"><span class="r1"><b>${g.br.name}</b><i class="cnt">${cnt}</i>${bedsBand(g.n>=2?used:null)}${capHtml(g.br.name,true)}</span></span>`; grid.appendChild(b); });
  
  cols.forEach(({t,br,first})=>{
    const [zh]=t.name.split(' ');
    const h=document.createElement('div'); h.className='vhead'+(first?' bstart':''); h.style.setProperty('--bc',br.hex); h.style.zIndex=String(60-cols.findIndex(c=>c.t===t));
    h.innerHTML=`${avatarBadge(t,zh)}<span class="zh">${esc(zh)}${t.isTrainee?'<em class="tr2">培</em>':''}</span>`;
    h.title=`${t.name} · ${br.name}`;
    grid.appendChild(h);
  });
  // 時間軸
  const ax=document.createElement('div'); ax.className='vaxis'; ax.style.height=totalH+'px';
  ax.innerHTML=Array.from({length:CLOSE-OPEN+1},(_,i)=>`<span class="h" style="top:${i*HOUR_H}px">${pad((OPEN+i)%24)}</span>`).join('');
  grid.appendChild(ax);
  // 各欄
  cols.forEach(({t,br,first})=>{
    const [zh]=t.name.split(' ');
    const col=document.createElement('div'); col.className='vcol'+(first?' bstart':''); col.style.height=totalH+'px';
    if(t.shift){ const sh=document.createElement('div'); sh.className='vshift';
      const s=Math.max(OPEN,minToH(t.shift.fromMin)), e=Math.min(CLOSE,minToH(t.shift.toMin-BUFFER));
      if(e>s){ sh.style.top=y(s)+'px'; sh.style.height=(y(e)-y(s))+'px'; sh.style.setProperty('--shift-off',(-y(s))+'px'); col.appendChild(sh); } }
    t.events.forEach(ev=>{
      const s=Math.max(OPEN,ev.s), e=Math.min(CLOSE,ev.e);
      if(ev.kind==='block'){ const d=document.createElement('div'); d.className='vblk';
        d.style.top=(y(s)+1)+'px'; d.style.height=Math.max(8,(e-s)*HOUR_H-2)+'px'; d.textContent=blockLabel(ev,t,zh); d.title=`${fmt(ev.s)}–${fmt(ev.e)} ${ev.title}`; col.appendChild(d); return; }
      if(ev.e<CLOSE){ const buf=document.createElement('div'); buf.className='vbuf'; buf.title=`清床緩衝 ${BUFFER} 分`;
        buf.style.top=y(ev.e)+'px'; buf.style.height=(Math.min(BUFFER/60,CLOSE-ev.e)*HOUR_H-1)+'px'; col.appendChild(buf); }
      const el=document.createElement('button');
      el.className=bkClass('vbk',t,ev,isToday,NOW);
      el.style.top=(y(s)+1)+'px'; el.style.height=Math.max(18,(e-s)*HOUR_H-3)+'px'; el.title=ev.title+hintTitle(ev);
      { const _t=fmt(ev.s).split(':'),_n=String(ev.customerNum||''); el.innerHTML=`<span class="th"><span class="t"><span class="hh">${_t[0]}</span><span class="co">:</span><span class="mm">${_t[1]}</span></span><span class="vdur">${durOf(ev)}分</span></span><span class="vbody">${_n?`<span class="id"><s>#</s><span class="n1">${_n.slice(0,2)}</span><span class="n2">${_n.slice(2)}</span></span>`:''}${nameHtml(ev.displayName)}</span>`; }
      if(!ev.customerNum) el.classList.add('noid'); if(parseFloat(el.style.height)<80) el.classList.add('sh');
      attachClick(el,ev,t); if(el.classList.contains('sel')) selectedEl=el;
      col.appendChild(el);
      const hb=hintBubbles(ev); if(hb){ hb.style.top=(y(s)-5)+'px'; col.appendChild(hb); }
    });
    grid.appendChild(col);
  });
  if(offs.length){ const o=document.createElement('div'); o.className='voff';
    o.innerHTML='<span>今日休</span>'+offs.map(({t})=>{ const zh=t.name.split(' ')[0]; return `<span class="chip off">${avatarHtml(t,zh)}${esc(zh)}</span>`; }).join(''); grid.appendChild(o); }
  if(!cols.length){ const o=document.createElement('div'); o.className='voff'; o.textContent='本日無人上班'; grid.appendChild(o); }
  const keepY=board.scrollTop, first=!board.querySelector('.grid,.vgrid');
  board.innerHTML=''; board.appendChild(sum); board.appendChild(grid);  grid.style.setProperty('--vsum-h',sum.offsetHeight+'px'); grid.style.setProperty('--vband-h',(grid.querySelector('.vband:not(.c0)')?.offsetHeight||22)+'px');
  if(isToday && NOW>=OPEN && NOW<=CLOSE){ const now=document.createElement('div'); now.className='vnow';
    // 表頭高度＝第一個 vhead 的實際高度
    const headH=grid.querySelector('.vhead').offsetHeight+(grid.querySelector('.vband:not(.c0)')?.offsetHeight||0);
    now.style.top=(headH+y(NOW))+'px'; now.dataset.t=fmt(NOW); grid.style.position='relative'; grid.appendChild(now); }
  if(first){ if(isToday) board.scrollTop=Math.max(0,y(nowH())-120); } else board.scrollTop=keepY;
  updateSrc();
}
function updateSrc(){
  const ft=new Date(data.fetchedAt);
  const src=document.getElementById('src'); src.classList.remove('busy','err');
  document.getElementById('srcText').textContent=`行事曆 · ${pad(ft.getHours())}:${pad(ft.getMinutes())}:${pad(ft.getSeconds())} 更新`;
  if(data.calendarErrors?.length){ src.classList.add('err'); document.getElementById('srcText').textContent=`行事曆部分無回應（${data.calendarErrors.join('、')}）`; }
}
function renderDate(){
  const [y,m,d]=dateKey.split('-').map(Number);
  document.getElementById('dateLabel').innerHTML=`<b>${pad(m)}/${pad(d)}</b><span class="wd"> 週${WD[new Date(y,m-1,d).getDay()]}</span>`;
  document.getElementById('datePick').value=dateKey;
  document.getElementById('todayBtn').textContent = dateKey===todayKey() ? '今天' : '回到今天';
}

/* ── 顧客面板（overlay，預設收合） ── */
const panel=document.getElementById('panel'), scrim=document.getElementById('scrim');
async function openCustomer(ev,t){
  if(EMBEDDED){   /* r108：嵌在顧客檔案系統裡時，改由外層開「時間軸側欄」（沿用顧客檔案表頭＋到訪紀錄） */
    try{ window.parent.postMessage({ type:'spacethai:open-booking', booking:{ num:ev.customerNum||null, name:ev.displayName||'', date:dateKey, start:fmt(ev.s), end:fmt(ev.e), dur:durOf(ev), teacher:t.name, cp:!!ev.cp, plan:ev.plan||null, title:ev.title||'', trainee:!!t.isTrainee, why:ev.hintWhy||[], key:Date.now() } }, location.origin); return; }catch(e){}
  }
  const [zh]=t.name.split(' ');
  const [y,m,d]=dateKey.split('-');
  document.getElementById('ctxText').textContent=`${m}/${d} ${fmt(ev.s)}–${fmt(ev.e)} · ${zh} · ${durOf(ev)} 分`;
  const body=document.getElementById('pBody');
  panel.classList.add('open'); scrim.classList.add('on');
  if(!ev.customerNum){
    body.innerHTML=`<div class="anon"><div class="cname">${esc(ev.displayName)}</div>${ev.hintWhy?.length?`<div class="hdesc">${hintKeys(ev).map(k=>`<div>${hbub(k)}<span>${esc(ev.hintWhy.find(w=>w.startsWith(HINT_LBL[k]))||HINT_LBL[k])}</span></div>`).join('')}</div>`:''}<p>行事曆上此筆預約沒有顧客編號，尚未建立顧客檔案。</p></div>`;
    return;
  }
  body.innerHTML=`<div class="empty">載入 #${ev.customerNum}…</div>`;
  const num=ev.customerNum, myKey=selectedKey;
  const [cs,recs] = await Promise.all([
    rest(`customers?select=num,name,display,phone,tags,note,birthday,country&num=eq.${num}&limit=1`),
    rest(`records?select=date,store,staff_name_legacy,duration,plan,is_draft&customer_num=eq.${num}&is_draft=eq.false&order=date.desc&limit=400`),
  ]).catch(()=>[[],[]]);
  const c=cs[0]||null;
  if(selectedKey!==myKey) return;
  if(!c){
    body.innerHTML=`<div class="anon"><div class="cnum">顧客編號 #${num}</div><div class="cname">${esc(ev.displayName)}</div><p>顧客檔案系統尚無此編號的資料。</p></div>`;
    return;
  }
  const rs=recs||[];
  const freq={}; rs.forEach(r=>{ if(r.staff_name_legacy) freq[r.staff_name_legacy]=(freq[r.staff_name_legacy]||0)+1; });
  const fav=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';
  const mmdd=s=>s?s.slice(5).replace('-','/'):'—';
  body.innerHTML=`
    <div class="cnum">顧客編號 #${c.num}</div>
    <div class="cname">${esc(c.name)}</div>
    ${ev.hintWhy?.length?`<div class="hdesc">${hintKeys(ev).map((k,i)=>`<div>${hbub(k)}<span>${esc(ev.hintWhy.find(w=>w.startsWith(HINT_LBL[k]))||HINT_LBL[k])}</span></div>`).join('')}<small>依紀錄推測，以櫃台確認為準</small></div>`:''}
    <div class="tags">${(c.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
    <dl class="kv">
      <dt>電話</dt><dd class="mono">${esc(c.phone||'—')}</dd>
      ${c.display&&c.display!==c.name?`<dt>顯示名</dt><dd>${esc(c.display)}</dd>`:''}
      ${c.birthday?`<dt>生日</dt><dd class="mono">${esc(c.birthday)}</dd>`:''}
      ${c.country?`<dt>國籍</dt><dd>${esc(c.country)}</dd>`:''}
    </dl>
    <div class="stats">
      <span><b>${rs.length}</b>來店次數</span>
      <span><b>${mmdd(rs[0]?.date)}</b>上次來店</span>
      <span><b>${esc(fav)}</b>常指定</span>
    </div>
    ${c.note?`<div class="note">${esc(c.note)}</div>`:''}
    <h4>最近服務紀錄</h4>
    ${rs.slice(0,8).map(r=>`<div class="rec"><span class="d">${mmdd(r.date)}</span><span>${esc(r.store||'')} · ${esc(r.staff_name_legacy||'')}</span><span class="p">${r.duration||''} 分</span></div>`).join('')||'<div class="empty" style="padding:16px">尚無紀錄</div>'}
    <a class="go" id="goFull">開啟完整顧客檔案 →</a>`;
  document.getElementById('goFull').onclick=()=>openFullProfile(c.num);
}
function openFullProfile(num){
  if(EMBEDDED){ window.parent.postMessage({ type:'spacethai:open-customer', num }, location.origin); }
  else { location.href = `./?num=${num}`; }
}
function closePanel(){ panel.classList.remove('open'); scrim.classList.remove('on'); if(selectedEl){selectedEl.classList.remove('sel');selectedEl=null;} selectedKey=null; }
document.getElementById('pClose').onclick=closePanel;
window.addEventListener('message',e=>{ if(e.origin===location.origin && e.data && e.data.type==='spacethai:booking-closed') closePanel(); });
scrim.onclick=closePanel;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePanel(); });

/* ── 日期 / 分店 / 載入 ── */
let _tlReadySent=false;
function tlReady(){ if(_tlReadySent||!EMBEDDED) return; _tlReadySent=true; try{ window.parent.postMessage({ type:'spacethai:timeline-ready' }, location.origin); }catch(e){} }
async function load(){
  const src=document.getElementById('src'); src.classList.add('busy'); src.classList.remove('err');
  document.getElementById('srcText').textContent='行事曆 · 更新中';
  renderDate();
  const dk=dateKey, userNav=slideDir!==0, dirNow=slideDir;
  try{ const c=userNav?dayCache.get(dk):null; const d=(c && Date.now()-c.t<45000)?c.d:await loadTimeline(dk);
    if(dk!==dateKey) return;                                  // 使用者已經又換日期：丟掉這份過期的回應
    dayCache.set(dk,{d,t:Date.now()}); data=d; lastOk=Date.now(); renderPpl(); render(); loadMonth(dateKey); tlReady();
    if(dirNow){ slideDir=0; slideIn(dirNow); } else slideReset();
    if(userNav||!window._pf){ window._pf=1; setTimeout(()=>prefetchNeighbours(dk),500); } }
  catch(e){
    if(dk!==dateKey) return;
    tlReady(); slideDir=0; slideReset();
    src.classList.remove('busy'); src.classList.add('err');
    if(e.noauth && (window._nar=(window._nar||0)+1)<=3){ document.getElementById('srcText').textContent='確認登入中…'; showMsg('正在確認登入狀態…'); _forceTok=true; setTimeout(load,2500); return; }
    if(e.noauth){ document.getElementById('srcText').textContent='未登入'; showMsg(`請先登入顧客檔案系統。${EMBEDDED?'<br><a href="#" onclick="load();return false">重試</a>':'<br><a href="./">前往登入 →</a>'}`); noauthWait=true; return; }
    if(e.forbidden){ document.getElementById('srcText').textContent='無權限'; showMsg('你的帳號沒有時間軸權限，請聯絡管理員。'); return; }
    const t=lastOk?new Date(lastOk):null;
    document.getElementById('srcText').textContent=t?`行事曆無回應 · 顯示 ${pad(t.getHours())}:${pad(t.getMinutes())} 資料`:'行事曆無回應';
    if(data && data.date===dateKey) render(); else showMsg('行事曆無回應，請稍後再試。');
  }
}
const dayCache=new Map();   // dk -> {d,t}：換日期用（45 秒內有效）；定時更新不用
let slideDir=0;
function slideOut(dir){ board.style.transition='transform .2s ease-out,opacity .2s ease-out'; board.style.transform='translateX('+(-dir*26)+'px)'; board.style.opacity='.35'; }
function slideIn(dir){ board.style.transition='none'; board.style.transform='translateX('+(dir*40)+'px)'; board.style.opacity='.35'; void board.offsetWidth;
  board.style.transition='transform .28s cubic-bezier(.2,.8,.25,1),opacity .28s ease-out'; board.style.transform=''; board.style.opacity=''; setTimeout(()=>{ board.style.transition=''; },320); }
function slideReset(){ board.style.transition=''; board.style.transform=''; board.style.opacity=''; }
const dkShift=(dk,n)=>{ const [y,m,d]=dk.split('-').map(Number); const dt=new Date(y,m-1,d+n); return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`; };
async function prefetchNeighbours(dk){ for(const n of [1,-1]){ const k=dkShift(dk,n); const c=dayCache.get(k); if(c && Date.now()-c.t<45000) continue; if(dk!==dateKey) return;
  try{ const d=await loadTimeline(k,false); dayCache.set(k,{d,t:Date.now()}); }catch(e){} } }
function setDate(dk){ const dir=dk>dateKey?1:(dk<dateKey?-1:0); dateKey=dk; closePanel(); closeCapPop(); slideDir=dir;
  if(dir && board.querySelector('.grid,.vgrid')) slideOut(dir); else board.innerHTML=''; load(); }
function shiftDate(n){ const [y,m,d]=dateKey.split('-').map(Number); const dt=new Date(y,m-1,d+n); setDate(`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`); }
document.getElementById('prev').onclick=()=>shiftDate(-1);
document.getElementById('next').onclick=()=>shiftDate(1);
document.getElementById('todayBtn').onclick=()=>setDate(todayKey());
document.getElementById('dateLabel').onclick=()=>{ const p=document.getElementById('datePick'); p.showPicker?p.showPicker():p.click(); };
document.getElementById('datePick').onchange=e=>{ if(e.target.value) setDate(e.target.value); };
document.getElementById('brPop').addEventListener('change',e=>{
  filter=e.target.value; const dot=document.getElementById('branchDot');
  dot.className='dot'+(filter==='all'?' all':''); dot.style.background=filter==='all'?'':(filter==='中山'?'var(--zs)':'var(--nj)');
  document.getElementById('brText').textContent=filter==='all'?'全部據點':filter;
  document.getElementById('brBtn').classList.toggle('act',filter!=='all');
  document.getElementById('brPop').classList.remove('open');
  if(data){ board.innerHTML=''; render(); }
});
function fitBoard(){ const hh=document.querySelector('header').offsetHeight; document.documentElement.style.setProperty('--head-h',hh+'px'); document.querySelector('.main').style.height=(window.innerHeight-hh)+'px'; }
fitBoard(); window.addEventListener('resize',fitBoard);
let lastMode=isMobile();
let rzT=null;
window.addEventListener('resize',()=>{ const m=isMobile(); if(m!==lastMode){ lastMode=m; if(data){ board.innerHTML=''; render(); } return; }
  if(!m){ clearTimeout(rzT); rzT=setTimeout(()=>{ if(data) render(); },150); } });

load();
setInterval(()=>{ if(!document.hidden) load(); }, 60000);   // 每分鐘即時重抓
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && lastOk && Date.now()-lastOk>60000) load(); });
</script>
<script>
(function(){const bar=document.querySelector('.bar'); const seg=document.createElement('div'); seg.className='seg';
 seg.innerHTML='<button class="on" data-v="all">全部據點</button><button data-v="南京三民"><i class="dot" style="background:#2F5E4A"></i>南京三民</button><button data-v="中山"><i class="dot" style="background:#B84E2C"></i>中山</button>';
 const ppl=document.querySelectorAll('.bar .ppl')[1]; bar.insertBefore(seg,document.querySelector('.bar .spacer'));
 seg.onclick=e=>{const v=e.target.closest('button')?.dataset.v; if(!v) return; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===v)); document.querySelector('#brPop input[value="'+v+'"]').click();};})();
</script>
