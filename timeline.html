<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小泰空 · 時間軸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ── 與顧客檔案系統 style-*.css 同一組 tokens ── */
  :root{
    --brand:#AE6C56; --brand-dark:#91563E; --brand-light:#F8F2EE; --brand-bg:rgba(174,108,86,.07); --brand-bdr:rgba(174,108,86,.22);
    --gold:#C9A84C; --green:#2a9d5c; --red:#D94F4F;
    --text:#111; --text-muted:#888; --text-hint:#bbb;
    --border:#e8e8e8; --border2:#ebebeb; --surface:#fff; --surface2:#f7f7f7; --surface3:#fafafa;
    --nj:#4E5D3E; --zs:#96382E;
    --d120:#CFB3B3; --d90:#D1C2B3; --d60:#EAD6C5; --d90f:#EBE4C5; --tr:#C0D3B5; --badge:#DF4B3C;
    --blk:#F0EBE7; --blk-bdr:#E3DAD3;
    --mono:'DM Mono',ui-monospace,Menlo,monospace;
    --sans:'Noto Sans TC',-apple-system,system-ui,sans-serif;
    --hour-w:112px; --row-h:54px; --name-w:190px; --panel-w:380px;
    --hour-h:64px; --col-w:36px; --axis-w:34px;   /* 直屏 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--surface2);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  /* ── 頂欄 ── */
  header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
  .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:15px;margin-right:6px}
  .brand small{font-family:var(--mono);font-weight:400;color:var(--text-muted);margin-left:8px;font-size:12px}
  body.embedded .brand{display:none}
  .datenav{display:flex;align-items:center;gap:4px;font-family:var(--mono)}
  .datenav button{width:30px;height:30px;border:1px solid var(--border);border-radius:8px;color:var(--text-muted);background:var(--surface)}
  .datenav button:hover{border-color:var(--brand)}
  .datenav .d{font-size:15px;padding:0 6px;white-space:nowrap;cursor:pointer}
  .datenav .today{width:auto;padding:0 10px;font-size:12px;white-space:nowrap}
  .datenav input[type=date]{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:13px;background:var(--surface)}
  .seg button{padding:5px 11px;color:var(--text-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .seg button+button{border-left:1px solid var(--border)}
  .seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .ppl{position:relative}
  .pplbtn{height:30px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;color:var(--text-muted);white-space:nowrap}
  .pplbtn.act{border-color:var(--brand);color:var(--brand-dark)}
  .pplbtn span{font-family:var(--mono);font-size:11px}
  .pop{display:none;position:absolute;top:36px;left:0;z-index:50;width:260px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:8px 10px;font-size:13px}
  .pop.open{display:block}
  .pop label{display:flex;align-items:center;gap:8px;padding:5px 2px;cursor:pointer}
  .pop .row1{border-bottom:1px solid var(--border2);padding-bottom:8px;margin-bottom:6px;font-weight:500}
  .pop .acts{display:flex;gap:6px;margin-bottom:6px}
  .pop .acts button{flex:1;height:26px;border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text-muted);background:var(--surface2)}
  .pop .grp{font-size:11px;color:#fff;padding:1px 7px;border-radius:5px;display:inline-block;margin:8px 0 2px;font-weight:700}
  .pop .av{width:22px;height:22px;font-size:10px}
  .pop .off{color:var(--text-hint)}
  .spacer{flex:1}
  .src{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text-muted);white-space:nowrap}
  .src .pulse{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .src.busy .pulse{animation:blink 1s infinite}
  .src.err{color:var(--red)} .src.err .pulse{background:var(--red)}
  @keyframes blink{50%{opacity:.3}}
  .legend{display:flex;gap:12px;padding:0 12px 8px;font-size:11px;color:var(--text-muted);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .legend i{width:12px;height:9px;border-radius:2px;display:inline-block}
  /* ── 主板 ── */
  .main{position:relative;height:calc(100vh - var(--head-h,98px))}
  .board{position:relative;overflow:auto;height:100%;-webkit-overflow-scrolling:touch}
  .msg{padding:60px 20px;text-align:center;color:var(--text-muted);font-size:14px}
  .msg a{color:var(--brand)}
  /* ── 橫版（電腦）：老師列 × 時間橫軸 ── */
  .grid{display:grid;grid-template-columns:var(--name-w) 1fr;min-width:max-content;background:var(--surface)}
  .axis{display:contents}
  .axis .corner{position:sticky;left:0;top:0;z-index:21;background:var(--surface);border-bottom:1px solid var(--border);border-right:1px solid var(--border);height:34px;display:flex;align-items:flex-end;padding:0 12px 6px;font-family:var(--mono);font-size:11px;color:var(--text-hint)}
  .axis .hours{position:sticky;top:0;z-index:20;height:34px;border-bottom:1px solid var(--border);background:var(--surface)}
  .axis .h{position:absolute;bottom:6px;font-family:var(--mono);font-size:12px;color:var(--text-muted);transform:translateX(-50%)}
  .axis .h::after{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:6px;background:var(--border)}
  .axis .hours{background-image:linear-gradient(to right,#e0e0e0 1px,transparent 1px);background-size:calc(var(--hour-w) / 4) 5px;background-repeat:repeat-x;background-position:0 100%}
  .branch-head{grid-column:1/-1;padding:12px 0 6px;background:var(--surface2)}
  .branch-head .in{position:sticky;left:0;display:inline-flex;align-items:center;gap:10px;padding:0 12px}
  .bname{font-weight:700;font-size:13px;padding:1px 8px;border-radius:6px;color:#fff}
  .bwrap{position:relative;display:inline-block;margin-right:8px}
  .bwrap .badge{top:-8px;right:-10px}
  .vsum .bwrap .badge{min-width:16px;height:16px;line-height:16px;font-size:10px;top:-7px;right:-9px}
  .beds{display:inline-flex;align-items:center;gap:3px;margin-left:2px}
  .beds svg{width:16px;height:16px;display:block}
  .beds .on{color:var(--red)} .beds .offb{color:#cfcfcf}
  .beds .bl{font-size:11px;color:var(--text-muted);margin-right:3px}
  .row{display:contents}
  .row .who{position:sticky;left:0;z-index:10;background:var(--surface);height:var(--row-h);border-top:1px solid var(--border2);border-right:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 12px;white-space:nowrap}
  .row .who .rail{width:3px;height:28px;border-radius:2px;flex:none}
  .av{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-muted);flex:none;overflow:hidden;box-shadow:0 0 0 1px var(--border)}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .off .av{filter:grayscale(1);opacity:.55}
  .row .who .zh{font-weight:500;font-size:15px;flex:none}
  .row .who .en{font-family:var(--mono);font-size:11px;color:var(--text-hint);min-width:0;overflow:hidden;text-overflow:ellipsis}
  .row .who .tr{font-size:10px;color:#4E7A3E;border:1px solid #9DBB8E;padding:0 5px;border-radius:4px}
  .row .who .offlbl{font-size:11px;color:var(--text-hint)}
  .row .who .right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .avw{position:relative;display:inline-block;flex:none}
  .badge{position:absolute;top:-5px;right:-7px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--badge);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--surface);font-family:var(--sans)}
  .row .lane{position:relative;height:var(--row-h);border-top:1px solid var(--border2);background-color:var(--surface2);background-image:linear-gradient(to right,#dedede 1px,transparent 1px),linear-gradient(to right,#efefef 1px,transparent 1px);background-size:var(--hour-w) 100%,calc(var(--hour-w) / 4) 100%}
  .row.off .lane{background-color:#F5F5F5;background-image:repeating-linear-gradient(45deg,#E6E6E6 0 1px,transparent 1px 5px)}
  .shift{position:absolute;top:0;bottom:0;background-color:var(--surface);background-image:linear-gradient(to right,#e4e4e4 1px,transparent 1px),linear-gradient(to right,#f1f1f1 1px,transparent 1px);background-size:var(--hour-w) 100%,calc(var(--hour-w) / 4) 100%;background-position:var(--shift-off,0) 0;border-left:1px solid var(--border);border-right:1px solid var(--border)}
  .bk{position:absolute;top:6px;height:calc(var(--row-h) - 12px);border-radius:6px;padding:3px 7px;color:#2C2520;overflow:hidden;white-space:nowrap;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;line-height:1.15;transition:filter .12s;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
  .bk .l1{display:flex;align-items:center;gap:5px;min-width:0}
  .bk .num{font-family:var(--mono);font-size:12px;font-weight:700;background:rgba(0,0,0,.10);padding:0 5px;border-radius:4px;flex:none;line-height:16px}
  .bk .nm{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .bk .l2{display:flex;align-items:center;gap:5px}
  .bk.one{padding:3px 5px} .bk.one .l1{gap:4px} .bk.one .num{font-size:11px;padding:0 4px}
  .bk .dur{font-family:var(--mono);font-size:9px;background:rgba(255,255,255,.6);padding:0 4px;border-radius:3px;line-height:13px;flex:none}
  .bk:hover{filter:brightness(.93)}
  .bk:focus-visible,.bk.sel{outline:2px solid var(--badge);outline-offset:2px}
  .bk .t{font-family:var(--mono);font-size:10px;opacity:.75}
  .bk.d120{background:var(--d120)} .bk.d90{background:var(--d90)} .bk.d60{background:var(--d60)} .bk.trn{background:var(--tr)} .bk.free{background:var(--d90f)}
  .bk.past{opacity:.55}
  .buf{position:absolute;top:6px;height:calc(var(--row-h) - 12px);background:#E8E8E8;border-radius:6px}
  .blk{position:absolute;top:6px;height:calc(var(--row-h) - 12px);border-radius:6px;background:var(--blk);border:1px solid var(--blk-bdr);color:var(--text-muted);font-size:11px;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden}
  .now{position:absolute;top:34px;bottom:0;width:1px;background:var(--red);z-index:15;pointer-events:none}
  .now::before{content:attr(data-t);position:absolute;top:-22px;left:-22px;background:var(--red);color:#fff;font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:4px}
  /* ── 直版（手機）：時間縱軸 × 老師欄 ── */
  .vgrid{display:grid;grid-template-columns:var(--axis-w) repeat(var(--ncol),minmax(var(--col-w),1fr));min-width:100%;background:var(--surface)}
  .vhead{position:sticky;top:var(--vsum-h,30px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:6px 2px 5px;gap:3px;min-height:64px;justify-content:flex-end}
  .vhead.corner{align-items:flex-start;justify-content:flex-end;padding-left:4px;font-family:var(--mono);font-size:10px;color:var(--text-hint)}
  .vhead .av{width:28px;height:28px}
  .vhead .zh{font-size:12px;font-weight:500;line-height:1.1}
  .vhead .tr{font-size:9px;color:#4E7A3E;line-height:1;border:1px solid #9DBB8E;border-radius:3px;padding:0 3px;margin-bottom:1px}
  .vhead .avw{margin-top:4px}
  .vhead .band{height:3px;width:100%;border-radius:2px}
  .vhead.bstart{border-left:1px solid var(--border)}
  .vaxis{position:relative;border-right:1px solid var(--border);background:var(--surface);position:sticky;left:0;z-index:10}
  .vaxis .h{position:absolute;right:4px;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--text-muted)}
  .vcol{position:relative;background-color:var(--surface2);background-image:linear-gradient(to bottom,#dedede 1px,transparent 1px),linear-gradient(to bottom,#efefef 1px,transparent 1px);background-size:100% var(--hour-h),100% calc(var(--hour-h) / 4);border-right:1px solid var(--border2)}
  .vcol.bstart{border-left:1px solid var(--border)}
  .vshift{position:absolute;left:0;right:0;background-color:var(--surface);background-image:linear-gradient(to bottom,#e4e4e4 1px,transparent 1px),linear-gradient(to bottom,#f1f1f1 1px,transparent 1px);background-size:100% var(--hour-h),100% calc(var(--hour-h) / 4);background-position:0 var(--shift-off,0)}
  .vbk{position:absolute;left:2px;right:2px;border-radius:6px;padding:4px 4px;color:#2C2520;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:1px;line-height:1.15;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
  .vbk .vdur{font-family:var(--mono);font-size:9px;background:rgba(255,255,255,.6);border-radius:3px;padding:1px 3px;align-self:flex-start;line-height:1.2;white-space:nowrap}
  .vbk .t{font-family:var(--mono);font-size:9px;opacity:.75;white-space:nowrap}
  .vbk .c{font-size:11px;font-weight:700;word-break:break-all;overflow:hidden}
  .vbk .id{font-family:var(--mono);font-size:10px;font-weight:700;background:rgba(0,0,0,.10);border-radius:3px;padding:0 3px;align-self:flex-start}
  .vbk.d120{background:var(--d120)} .vbk.d90{background:var(--d90)} .vbk.d60{background:var(--d60)} .vbk.trn{background:var(--tr)} .vbk.free{background:var(--d90f)}
  .vbk.past{opacity:.55}
  .vbk.sel{outline:2px solid var(--badge);outline-offset:1px}
  .vbuf{position:absolute;left:2px;right:2px;background:#E8E8E8;border-radius:6px}
  .vblk{position:absolute;left:2px;right:2px;border-radius:5px;background:var(--blk);border:1px solid var(--blk-bdr);color:var(--text-muted);font-size:9px;display:flex;align-items:flex-start;padding:2px 3px;overflow:hidden;line-height:1.1}
  .vnow{position:absolute;left:0;right:0;height:1px;background:var(--red);z-index:15;pointer-events:none}
  .vnow::before{content:attr(data-t);position:absolute;left:2px;top:-8px;background:var(--red);color:#fff;font-family:var(--mono);font-size:9px;padding:0 4px;border-radius:3px;line-height:15px}
  .voff{grid-column:1/-1;padding:10px 10px 16px;font-size:12px;color:var(--text-muted);background:var(--surface2);border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .voff .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 2px;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--text)}
  .voff .chip .av{width:20px;height:20px;font-size:10px}
  .vsum{position:sticky;top:0;z-index:21;display:flex;gap:10px;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--border);font-size:11px;overflow-x:auto;scrollbar-width:none}
  .vsum::-webkit-scrollbar{display:none}
  .vsum .b{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .vsum .bname{font-size:11px;padding:0 6px}
  .vsum .beds svg{width:14px;height:14px}
  /* ── 顧客面板（overlay，預設收合） ── */
  .panel{position:fixed;top:0;right:0;bottom:0;z-index:40;width:var(--panel-w);max-width:100vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(0,0,0,.10);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s ease;visibility:hidden}
  .panel.open{transform:none;visibility:visible}
  .panel .ctx{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12px;color:var(--text-muted);background:var(--brand-light)}
  .panel .ctx button{width:28px;height:28px;border-radius:8px;color:var(--text-muted);flex:none;font-size:16px} .panel .ctx button:hover{background:var(--surface2)}
  .panel .body{padding:16px;overflow:auto;flex:1}
  .panel .empty{color:var(--text-hint);font-size:13px;text-align:center;padding:60px 20px}
  .scrim{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.18);display:none}
  .scrim.on{display:block}
  .cnum{font-family:var(--mono);font-size:12px;color:var(--text-muted)}
  .cname{font-size:20px;font-weight:700;margin:2px 0 6px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tag{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--brand-bg);color:var(--brand-dark);border:1px solid var(--brand-bdr)}
  .kv{display:grid;grid-template-columns:64px 1fr;gap:8px 12px;font-size:13px;margin:12px 0}
  .kv dt{color:var(--text-muted);font-size:12px;padding-top:1px} .kv dd{margin:0;word-break:break-all} .kv .mono{font-family:var(--mono)}
  .stats{display:flex;gap:18px;font-size:11px;color:var(--text-muted);padding:12px 0;border-top:1px solid var(--border2);border-bottom:1px solid var(--border2)}
  .stats b{display:block;font-family:var(--mono);font-size:18px;color:var(--text);font-weight:500}
  .note{margin:12px 0;font-size:13px;color:#7A4E1F;background:#FDF8EE;border:1px solid #E8C99B;border-radius:8px;padding:10px 12px;white-space:pre-wrap}
  h4{margin:16px 0 6px;font-size:12px;color:var(--text-muted);font-weight:500;letter-spacing:.04em}
  .rec{display:grid;grid-template-columns:auto 1fr auto;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border2)}
  .rec .d{font-family:var(--mono);color:var(--text-muted)} .rec .p{color:var(--text-hint);font-size:12px;white-space:nowrap}
  .go{display:inline-block;margin-top:16px;padding:8px 14px;border-radius:8px;background:var(--brand);color:#fff;font-size:13px;text-decoration:none;cursor:pointer}
  .anon .cname{font-weight:500} .anon p{color:var(--text-muted);font-size:13px}
  /* ── 手機 ── */
  @media (max-width:700px){
    :root{--head-h:52px}
    .bar{padding:8px 10px;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none} .bar::-webkit-scrollbar{display:none}
    .legend{display:none}
    .datenav button{width:28px;height:28px}
    .datenav .d{font-size:14px;padding:0 4px}
    .seg button{padding:5px 9px;font-size:12px}
    .src{display:none}
    .pop{position:fixed;top:52px;left:8px;right:8px;width:auto}
    .panel{top:auto;left:0;right:0;bottom:0;width:100%;max-height:78vh;border-left:0;border-top:1px solid var(--border);border-radius:14px 14px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.14);transform:translateY(102%)}
    .panel.open{transform:none}
    .panel .ctx{border-radius:14px 14px 0 0}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">小泰空 <small>時間軸</small></div>
    <div class="datenav">
      <button id="prev" aria-label="前一天">‹</button>
      <span class="d" id="dateLabel" title="點選日期"></span>
      <input type="date" id="datePick">
      <button id="next" aria-label="後一天">›</button>
      <button class="today" id="todayBtn">今天</button>
    </div>
    <div class="seg" id="branchSeg">
      <button aria-pressed="true" data-b="all">全部</button>
      <button aria-pressed="false" data-b="南京三民"><span class="dot" style="background:var(--nj)"></span>南京三民</button>
      <button aria-pressed="false" data-b="中山"><span class="dot" style="background:var(--zs)"></span>中山</button>
    </div>
    <div class="ppl"><button id="pplBtn" class="pplbtn">人員 <span id="pplCount"></span> ▾</button>
      <div class="pop" id="pplPop">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   小泰空 顧客檔案系統・時間軸（唯讀）r65
   資料：Edge Function `timeline?date=`（teachers + teacher_shift + 各老師 Google 行事曆）
   顧客面板：customers + records（直接讀 Supabase，與顧客檔案系統同一 session）
   版面：寬螢幕＝老師列×時間橫軸；手機直屏＝時間縱軸×上班老師欄
   ═══════════════════════════════════════════════════════════════ */
const SB_URL = 'https://lyphciitrhfomquorhfm.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5cGhjaWl0cmhmb21xdW9yaGZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzA3MDYsImV4cCI6MjA5MzA0NjcwNn0.IGl3kQij2zAwQaNXKdBhlL-mp5knAumcRaPwOBo1KFk';
const OPEN = 11, CLOSE = 25;           // 11:00 – 01:00
let BUFFER = 15;
const BRANCHES = [ { name:'南京三民', color:'var(--nj)', hex:'#4E5D3E' }, { name:'中山', color:'var(--zs)', hex:'#96382E' } ];
const EMBEDDED = window.self !== window.top;
if (EMBEDDED) document.body.classList.add('embedded');
const isMobile = () => window.innerWidth <= 700;

const sb = supabase.createClient(SB_URL, SB_ANON);   // 與主系統同 storage key → 共用登入
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── 工具 ── */
const pad = n => String(n).padStart(2,'0');
const fmt = h => `${pad(Math.floor(h)%24)}:${pad(Math.round((h%1)*60))}`;
const minToH = m => m/60;
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function nowH(){ const d=new Date(); return d.getHours()+d.getMinutes()/60; }
const WD=['日','一','二','三','四','五','六'];
function isoToH(iso, dateKey){
  const [y,m,d]=dateKey.split('-').map(Number);
  return (Date.parse(iso)-new Date(y,m-1,d,0,0,0).getTime())/3600000;
}
const avatarHtml = (t,zh) => `<span class="av">${t.avatar?`<img src="${esc(t.avatar)}" alt="" loading="lazy" data-z="${esc(zh)}" onerror="this.replaceWith(this.dataset.z)">`:esc(zh)}</span>`;
// 頭像＋右上角紅圈（今日預約數，0 不顯示）
const avatarBadge = (t,zh) => `<span class="avw">${avatarHtml(t,zh)}${bookingCount(t)?`<span class="badge" title="今日預約數">${bookingCount(t)}</span>`:''}</span>`;
const blockLabel = (ev,t,zh) => (ev.title.replace(t.name,'').replace(zh,'').trim()||ev.title);
const durOf = ev => ev.duration || Math.round((ev.e-ev.s)*60);
const isFree = ev => /不指定/.test(ev.title||'');
const durLabel = ev => `${durOf(ev)} 分${isFree(ev)?'不指定':''}`;
const bookingCount = t => t.events.filter(e=>e.kind==='booking').length;
// 正面（腳端看過去）的床：床頭板＋枕頭＋床墊＋床腳
const BED_SVG = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="3" y="1" width="14" height="7" rx="2"/><rect x="1.5" y="7.5" width="17" height="8.5" rx="1.8"/><rect x="6" y="3.2" width="8" height="3.2" rx="1.6" fill="#fff" opacity=".85"/><rect x="2.5" y="16" width="2.2" height="3"/><rect x="15.3" y="16" width="2.2" height="3"/></svg>';
// 目前此刻（含 15 分緩衝）該分店被占用的床數 = 正在服務中的預約數（只有「今天」才算）
function bedsNow(list,isToday,NOW){
  if(!isToday) return null;
  return list.reduce((n,t)=>n+(t.events.some(ev=>ev.kind==='booking'&&ev.s<=NOW&&NOW<ev.e+BUFFER/60)?1:0),0);
}
function bedsHtml(used){
  const n=used==null?0:Math.min(5,used);
  return `<span class="beds" title="${used==null?'非今日，不顯示即時床位':`目前占用 ${n} 張`}"><span class="bl">實時床位</span>${Array.from({length:5},(_,i)=>`<span class="${used!=null&&i<n?'on':'offb'}">${BED_SVG}</span>`).join('')}</span>`;
}
// 分店內排序：今天有上班的在前，休的在後（保持原順序）
const dutyFirst = list => [...list.filter(t=>t.shift), ...list.filter(t=>!t.shift)];

/* ── 狀態 ── */
let dateKey = todayKey(), filter='all', data=null, selectedEl=null, lastOk=null, selectedKey=null;
// 人員篩選（存 localStorage）：hidden = 取消勾選的 staffId；hideOff = 不顯示今日休
const PREF_KEY='tl_ppl';
let pref = (()=>{ try{ return Object.assign({hidden:[],hideOff:true}, JSON.parse(localStorage.getItem(PREF_KEY)||'{}')); }catch{ return {hidden:[],hideOff:true}; } })();
function savePref(){ try{ localStorage.setItem(PREF_KEY,JSON.stringify(pref)); }catch{} }
const isShown = t => !pref.hidden.includes(t.staffId) && !(pref.hideOff && !t.shift);
function renderPpl(){
  if(!data) return;
  const list=document.getElementById('pplList');
  list.innerHTML=BRANCHES.map(br=>`<div class="grp" style="background:${br.color}">${br.name}</div>`+data.teachers.filter(t=>t.branch===br.name).map(t=>{ const zh=t.name.split(' ')[0];
    const forced = pref.hideOff && !t.shift;
    return `<label class="${t.shift?'':'off'}"><input type="checkbox" data-id="${t.staffId}" ${(pref.hidden.includes(t.staffId)||forced)?'':'checked'} ${forced?'disabled':''}>${avatarHtml(t,zh)}<span>${esc(t.name)}</span>${t.shift?'':'<span style="margin-left:auto;font-size:11px">休</span>'}</label>`; }).join('')).join('');
  document.getElementById('hideOff').checked=pref.hideOff;
  const shown=data.teachers.filter(isShown).length, all=data.teachers.length;
  document.getElementById('pplCount').textContent=`${shown}/${all}`;
  document.getElementById('pplBtn').classList.toggle('act', shown!==all);
}
document.getElementById('pplBtn').onclick=e=>{ e.stopPropagation(); document.getElementById('pplPop').classList.toggle('open'); };
document.getElementById('pplPop').onclick=e=>e.stopPropagation();
document.addEventListener('click',()=>document.getElementById('pplPop').classList.remove('open'));
document.getElementById('hideOff').onchange=e=>{ pref.hideOff=e.target.checked; savePref(); renderPpl(); board.innerHTML=''; render(); };
document.getElementById('pplAll').onclick=()=>{ pref.hidden=[]; savePref(); renderPpl(); board.innerHTML=''; render(); };
document.getElementById('pplNone').onclick=()=>{ pref.hidden=data.teachers.map(t=>t.staffId); savePref(); renderPpl(); board.innerHTML=''; render(); };
document.getElementById('pplList').onchange=e=>{ const id=e.target.dataset.id; if(!id) return;
  pref.hidden=e.target.checked?pref.hidden.filter(x=>x!==id):[...pref.hidden,id]; savePref(); renderPpl(); board.innerHTML=''; render(); };

/* ── 載入 ── */
async function getToken(){ const { data:{ session } } = await sb.auth.getSession(); return session?.access_token || null; }
async function loadTimeline(dk){
  const token = await getToken();
  if(!token) throw Object.assign(new Error('noauth'),{noauth:true});
  const r = await fetch(`${SB_URL}/functions/v1/timeline?date=${dk}`, { headers:{ Authorization:`Bearer ${token}`, apikey: SB_ANON } });
  if(r.status===401) throw Object.assign(new Error('noauth'),{noauth:true});
  if(r.status===403) throw Object.assign(new Error('forbidden'),{forbidden:true});
  if(!r.ok) throw new Error(`timeline ${r.status}`);
  const j = await r.json();
  if(j.buffer) BUFFER = j.buffer;
  j.teachers.forEach(t=>{
    t.events = (t.events||[]).map(ev=>({ ...ev, s:isoToH(ev.start,dk), e:isoToH(ev.end,dk) })).filter(ev=>{
      if(ev.allDay) return false;                              // 整天型（休假）不畫，排休由排班表決定
      if(ev.kind==='block' && (ev.e-ev.s)>=20) return false;   // 24 小時型占用同上
      return ev.e > OPEN && ev.s < CLOSE;
    });
  });
  return j;
}

/* ── 渲染 ── */
const board=document.getElementById('board');
function showMsg(html){ board.innerHTML=`<div class="msg">${html}</div>`; }
function render(){ isMobile()?renderVertical():renderHorizontal(); }
function visibleBranches(){ return BRANCHES.filter(br=>filter==='all'||br.name===filter); }
function bkClass(prefix,t,ev,isToday,NOW){ return [prefix, t.isTrainee?'trn':(isFree(ev)?'free':`d${durOf(ev)}`), (isToday&&ev.e<NOW)?'past':'', selectedKey===ev.start+t.staffId?'sel':''].join(' '); }
function attachClick(el,ev,t){ el.addEventListener('click',()=>{ if(selectedEl) selectedEl.classList.remove('sel'); selectedEl=el; el.classList.add('sel'); selectedKey=ev.start+t.staffId; openCustomer(ev,t); }); }

/* 橫版 */
function renderHorizontal(){
  // 自適應：讓 11:00–01:00（14 小時）盡量塞進目前寬度；最小 56px/小時（不夠時橫向捲動）
  const nameW = board.clientWidth < 1100 ? 150 : 190;
  document.documentElement.style.setProperty('--name-w', nameW+'px');
  const HOUR_W = Math.max(56, Math.floor((board.clientWidth - nameW - 18) / (CLOSE-OPEN)));
  document.documentElement.style.setProperty('--hour-w', HOUR_W+'px');
  const compact = HOUR_W < 80;   // 窄：預約條只留編號＋姓名一行
  const x = h => (h - OPEN) * HOUR_W;
  const grid=document.createElement('div'); grid.className='grid';
  const totalW=(CLOSE-OPEN)*HOUR_W;
  const axis=document.createElement('div'); axis.className='axis';
  axis.innerHTML=`<div class="corner">分店 / 老師</div><div class="hours" style="width:${totalW}px">
    ${Array.from({length:CLOSE-OPEN+1},(_,i)=>`<span class="h" style="left:${i*HOUR_W}px">${pad((OPEN+i)%24)}:00</span>`).join('')}</div>`;
  grid.appendChild(axis);
  const isToday = dateKey===todayKey(), NOW=nowH();
  visibleBranches().forEach(br=>{
    const all=data.teachers.filter(t=>t.branch===br.name);
    const list=dutyFirst(all.filter(isShown));
    const onDuty=all.filter(t=>t.shift).length;
    const cnt=all.reduce((n,t)=>n+bookingCount(t),0);
    const head=document.createElement('div'); head.className='branch-head';
    head.innerHTML=`<div class="in"><span class="bwrap"><span class="bname" style="background:${br.color}">${br.name}</span>${cnt?`<span class="badge" title="今日預約總數">${cnt}</span>`:''}</span>${bedsHtml(bedsNow(all,isToday,NOW))}</div>`;
    grid.appendChild(head);
    list.forEach(t=>{
      const [zh,en]=t.name.split(' ');
      const row=document.createElement('div'); row.className='row'+(t.shift?'':' off');
      const who=document.createElement('div'); who.className='who';
      who.innerHTML=`<span class="rail" style="background:${t.isTrainee?'#9DBB8E':br.color}"></span>${avatarBadge(t,zh)}
        <span class="zh">${esc(zh)}</span><span class="en">${esc(en||'')}</span>
        <span class="right">${t.isTrainee?'<span class="tr">培訓</span>':''}${t.shift?'':'<span class="offlbl">休</span>'}</span>`;
      const lane=document.createElement('div'); lane.className='lane'; lane.style.width=totalW+'px';
      if(t.shift){ const sh=document.createElement('div'); sh.className='shift';
        const s=Math.max(OPEN,minToH(t.shift.fromMin)), e=Math.min(CLOSE,minToH(t.shift.toMin-BUFFER));
        if(e>s){ sh.style.left=x(s)+'px'; sh.style.width=(x(e)-x(s))+'px'; sh.style.setProperty('--shift-off',(-x(s))+'px'); lane.appendChild(sh); } }
      t.events.forEach(ev=>{
        const s=Math.max(OPEN,ev.s), e=Math.min(CLOSE,ev.e);
        if(ev.kind==='block'){ const d=document.createElement('div'); d.className='blk';
          d.style.left=x(s)+'px'; d.style.width=Math.max(6,(e-s)*HOUR_W-2)+'px'; d.textContent=blockLabel(ev,t,zh); d.title=`${fmt(ev.s)}–${fmt(ev.e)} ${ev.title}`; lane.appendChild(d); return; }
        if(ev.e<CLOSE){ const buf=document.createElement('div'); buf.className='buf'; buf.title=`清床緩衝 ${BUFFER} 分`;
          const bw=Math.min(BUFFER/60,CLOSE-ev.e)*HOUR_W-3; buf.style.left=(x(ev.e)-8)+'px'; buf.style.width=(bw+8)+'px'; lane.appendChild(buf); }
        const el=document.createElement('button');
        el.className=bkClass('bk',t,ev,isToday,NOW);
        el.style.left=x(s)+'px'; el.style.width=Math.max(20,(e-s)*HOUR_W-3)+'px'; el.title=ev.title;
        const w=(e-s)*HOUR_W-3;
        el.innerHTML=`<span class="l1">${ev.customerNum?`<span class="num">#${ev.customerNum}</span>`:''}${(w>=70||!ev.customerNum)?`<span class="nm">${esc(ev.displayName)}</span>`:''}</span>
          ${w>=95?`<span class="l2"><span class="t">${compact?fmt(ev.s):`${fmt(ev.s)}–${fmt(ev.e)}`}</span><span class="dur">${durLabel(ev)}</span></span>`:''}`;
        if(w<95) el.classList.add('one');
        attachClick(el,ev,t); if(el.classList.contains('sel')) selectedEl=el;
        lane.appendChild(el);
      });
      row.append(who,lane); grid.appendChild(row);
    });
  });
  const keepX=board.scrollLeft, keepY=board.scrollTop, first=!board.querySelector('.grid,.vgrid');
  board.innerHTML=''; board.appendChild(grid);
  if(isToday && NOW>=OPEN && NOW<=CLOSE){ const now=document.createElement('div'); now.className='now'; now.style.left=`calc(var(--name-w) + ${x(NOW)}px)`; now.dataset.t=fmt(NOW); board.appendChild(now); }
  const fits = nameW+totalW <= board.clientWidth+2;
  if(first){ if(isToday && !fits) board.scrollLeft=Math.max(0,x(nowH())-220); } else { board.scrollLeft=fits?0:keepX; board.scrollTop=keepY; }
  updateSrc();
}

/* 直版（手機）：只列「有上班」的老師成欄；排休老師列在最下方一行 */
function renderVertical(){
  const HOUR_H=64;
  const y = h => (h - OPEN) * HOUR_H;
  const isToday = dateKey===todayKey(), NOW=nowH();
  const cols=[]; const offs=[];
  visibleBranches().forEach(br=>{
    const list=data.teachers.filter(t=>t.branch===br.name);
    list.forEach((t,i)=>{ if(!t.shift && !t.events.some(e=>e.kind==='booking')){ if(isShown(t)) offs.push({t,br}); return; }
      if(isShown(t)) cols.push({t,br,first:cols.length && cols[cols.length-1].br!==br}); });
  });
  const totalH=(CLOSE-OPEN)*HOUR_H;
  const grid=document.createElement('div'); grid.className='vgrid'; grid.style.setProperty('--ncol',Math.max(1,cols.length));
  // 分店摘要（床位 / 預約數）
  const sum=document.createElement('div'); sum.className='vsum';
  sum.innerHTML=visibleBranches().map(br=>{ const list=data.teachers.filter(t=>t.branch===br.name);
    const c=list.reduce((n,t)=>n+bookingCount(t),0);
    return `<span class="b"><span class="bwrap"><span class="bname" style="background:${br.color}">${br.name}</span>${c?`<span class="badge">${c}</span>`:''}</span>${bedsHtml(bedsNow(list,isToday,NOW))}</span>`; }).join('');
  // 表頭
  const corner=document.createElement('div'); corner.className='vhead corner'; corner.textContent='時間'; grid.appendChild(corner);
  cols.forEach(({t,br,first})=>{
    const [zh]=t.name.split(' ');
    const h=document.createElement('div'); h.className='vhead'+(first?' bstart':'');
    h.innerHTML=`${t.isTrainee?'<span class="tr">培訓</span>':''}${avatarBadge(t,zh)}<span class="zh">${esc(zh)}</span><span class="band" style="background:${t.isTrainee?'#9DBB8E':br.color}"></span>`;
    h.title=`${t.name} · ${br.name}`;
    grid.appendChild(h);
  });
  // 時間軸
  const ax=document.createElement('div'); ax.className='vaxis'; ax.style.height=totalH+'px';
  ax.innerHTML=Array.from({length:CLOSE-OPEN+1},(_,i)=>`<span class="h" style="top:${i*HOUR_H}px">${pad((OPEN+i)%24)}</span>`).join('');
  grid.appendChild(ax);
  // 各欄
  cols.forEach(({t,br,first})=>{
    const [zh]=t.name.split(' ');
    const col=document.createElement('div'); col.className='vcol'+(first?' bstart':''); col.style.height=totalH+'px';
    if(t.shift){ const sh=document.createElement('div'); sh.className='vshift';
      const s=Math.max(OPEN,minToH(t.shift.fromMin)), e=Math.min(CLOSE,minToH(t.shift.toMin-BUFFER));
      if(e>s){ sh.style.top=y(s)+'px'; sh.style.height=(y(e)-y(s))+'px'; sh.style.setProperty('--shift-off',(-y(s))+'px'); col.appendChild(sh); } }
    t.events.forEach(ev=>{
      const s=Math.max(OPEN,ev.s), e=Math.min(CLOSE,ev.e);
      if(ev.kind==='block'){ const d=document.createElement('div'); d.className='vblk';
        d.style.top=(y(s)+1)+'px'; d.style.height=Math.max(8,(e-s)*HOUR_H-2)+'px'; d.textContent=blockLabel(ev,t,zh); d.title=`${fmt(ev.s)}–${fmt(ev.e)} ${ev.title}`; col.appendChild(d); return; }
      if(ev.e<CLOSE){ const buf=document.createElement('div'); buf.className='vbuf'; buf.title=`清床緩衝 ${BUFFER} 分`;
        buf.style.top=(y(ev.e)-8)+'px'; buf.style.height=(Math.min(BUFFER/60,CLOSE-ev.e)*HOUR_H-2+8)+'px'; col.appendChild(buf); }
      const el=document.createElement('button');
      el.className=bkClass('vbk',t,ev,isToday,NOW);
      el.style.top=(y(s)+1)+'px'; el.style.height=Math.max(18,(e-s)*HOUR_H-3)+'px'; el.title=ev.title;
      el.innerHTML=`<span class="vdur">${durOf(ev)}分${isFree(ev)?'不指定':''}</span><span class="t">${fmt(ev.s)}</span><span class="c">${esc(ev.displayName)}</span>${ev.customerNum?`<span class="id">#${ev.customerNum}</span>`:''}`;
      attachClick(el,ev,t); if(el.classList.contains('sel')) selectedEl=el;
      col.appendChild(el);
    });
    grid.appendChild(col);
  });
  if(offs.length){ const o=document.createElement('div'); o.className='voff';
    o.innerHTML='<span>今日休</span>'+offs.map(({t})=>{ const zh=t.name.split(' ')[0]; return `<span class="chip off">${avatarHtml(t,zh)}${esc(zh)}</span>`; }).join(''); grid.appendChild(o); }
  if(!cols.length){ const o=document.createElement('div'); o.className='voff'; o.textContent='本日無人上班'; grid.appendChild(o); }
  const keepY=board.scrollTop, first=!board.querySelector('.grid,.vgrid');
  board.innerHTML=''; board.appendChild(sum); board.appendChild(grid); grid.style.setProperty('--vsum-h',sum.offsetHeight+'px');
  if(isToday && NOW>=OPEN && NOW<=CLOSE){ const now=document.createElement('div'); now.className='vnow';
    // 表頭高度＝第一個 vhead 的實際高度
    const headH=grid.querySelector('.vhead').offsetHeight;
    now.style.top=(headH+y(NOW))+'px'; now.dataset.t=fmt(NOW); grid.style.position='relative'; grid.appendChild(now); }
  if(first){ if(isToday) board.scrollTop=Math.max(0,y(nowH())-120); } else board.scrollTop=keepY;
  updateSrc();
}
function updateSrc(){
  const ft=new Date(data.fetchedAt);
  const src=document.getElementById('src'); src.classList.remove('busy','err');
  document.getElementById('srcText').textContent=`行事曆 · ${pad(ft.getHours())}:${pad(ft.getMinutes())}:${pad(ft.getSeconds())} 更新`;
  if(data.calendarErrors?.length){ src.classList.add('err'); document.getElementById('srcText').textContent=`行事曆部分無回應（${data.calendarErrors.join('、')}）`; }
}
function renderDate(){
  const [y,m,d]=dateKey.split('-').map(Number);
  document.getElementById('dateLabel').innerHTML=`<b>${pad(m)}/${pad(d)}</b> 週${WD[new Date(y,m-1,d).getDay()]}`;
  document.getElementById('datePick').value=dateKey;
}

/* ── 顧客面板（overlay，預設收合） ── */
const panel=document.getElementById('panel'), scrim=document.getElementById('scrim');
async function openCustomer(ev,t){
  const [zh]=t.name.split(' ');
  const [y,m,d]=dateKey.split('-');
  document.getElementById('ctxText').textContent=`${m}/${d} ${fmt(ev.s)}–${fmt(ev.e)} · ${zh} · ${durOf(ev)} 分`;
  const body=document.getElementById('pBody');
  panel.classList.add('open'); scrim.classList.add('on');
  if(!ev.customerNum){
    body.innerHTML=`<div class="anon"><div class="cname">${esc(ev.displayName)}</div><p>行事曆上此筆預約沒有顧客編號，尚未建立顧客檔案。</p></div>`;
    return;
  }
  body.innerHTML=`<div class="empty">載入 #${ev.customerNum}…</div>`;
  const num=ev.customerNum, myKey=selectedKey;
  const [{data:c},{data:recs}] = await Promise.all([
    sb.from('customers').select('num,name,display,phone,tags,note,birthday,country').eq('num',num).maybeSingle(),
    sb.from('records').select('date,store,staff_name_legacy,duration,plan,is_draft').eq('customer_num',num).eq('is_draft',false).order('date',{ascending:false}).limit(400),
  ]);
  if(selectedKey!==myKey) return;
  if(!c){
    body.innerHTML=`<div class="anon"><div class="cnum">顧客編號 #${num}</div><div class="cname">${esc(ev.displayName)}</div><p>顧客檔案系統尚無此編號的資料。</p></div>`;
    return;
  }
  const rs=recs||[];
  const freq={}; rs.forEach(r=>{ if(r.staff_name_legacy) freq[r.staff_name_legacy]=(freq[r.staff_name_legacy]||0)+1; });
  const fav=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';
  const mmdd=s=>s?s.slice(5).replace('-','/'):'—';
  body.innerHTML=`
    <div class="cnum">顧客編號 #${c.num}</div>
    <div class="cname">${esc(c.name)}</div>
    <div class="tags">${(c.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
    <dl class="kv">
      <dt>電話</dt><dd class="mono">${esc(c.phone||'—')}</dd>
      ${c.display&&c.display!==c.name?`<dt>顯示名</dt><dd>${esc(c.display)}</dd>`:''}
      ${c.birthday?`<dt>生日</dt><dd class="mono">${esc(c.birthday)}</dd>`:''}
      ${c.country?`<dt>國籍</dt><dd>${esc(c.country)}</dd>`:''}
    </dl>
    <div class="stats">
      <span><b>${rs.length}</b>來店次數</span>
      <span><b>${mmdd(rs[0]?.date)}</b>上次來店</span>
      <span><b>${esc(fav)}</b>常指定</span>
    </div>
    ${c.note?`<div class="note">${esc(c.note)}</div>`:''}
    <h4>最近服務紀錄</h4>
    ${rs.slice(0,8).map(r=>`<div class="rec"><span class="d">${mmdd(r.date)}</span><span>${esc(r.store||'')} · ${esc(r.staff_name_legacy||'')}</span><span class="p">${r.duration||''} 分</span></div>`).join('')||'<div class="empty" style="padding:16px">尚無紀錄</div>'}
    <a class="go" id="goFull">開啟完整顧客檔案 →</a>`;
  document.getElementById('goFull').onclick=()=>openFullProfile(c.num);
}
function openFullProfile(num){
  if(EMBEDDED){ window.parent.postMessage({ type:'spacethai:open-customer', num }, location.origin); }
  else { location.href = `./?num=${num}`; }
}
function closePanel(){ panel.classList.remove('open'); scrim.classList.remove('on'); if(selectedEl){selectedEl.classList.remove('sel');selectedEl=null;} selectedKey=null; }
document.getElementById('pClose').onclick=closePanel;
scrim.onclick=closePanel;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePanel(); });

/* ── 日期 / 分店 / 載入 ── */
async function load(){
  const src=document.getElementById('src'); src.classList.add('busy'); src.classList.remove('err');
  document.getElementById('srcText').textContent='行事曆 · 更新中';
  renderDate();
  try{ const d=await loadTimeline(dateKey); data=d; lastOk=Date.now(); renderPpl(); render(); }
  catch(e){
    src.classList.remove('busy'); src.classList.add('err');
    if(e.noauth){ document.getElementById('srcText').textContent='未登入'; showMsg(`請先登入顧客檔案系統。${EMBEDDED?'':'<br><a href="./">前往登入 →</a>'}`); return; }
    if(e.forbidden){ document.getElementById('srcText').textContent='無權限'; showMsg('時間軸目前僅開放管理員使用。'); return; }
    const t=lastOk?new Date(lastOk):null;
    document.getElementById('srcText').textContent=t?`行事曆無回應 · 顯示 ${pad(t.getHours())}:${pad(t.getMinutes())} 資料`:'行事曆無回應';
    if(data && data.date===dateKey) render(); else showMsg('行事曆無回應，請稍後再試。');
  }
}
function setDate(dk){ dateKey=dk; closePanel(); board.innerHTML=''; load(); }
function shiftDate(n){ const [y,m,d]=dateKey.split('-').map(Number); const dt=new Date(y,m-1,d+n); setDate(`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`); }
document.getElementById('prev').onclick=()=>shiftDate(-1);
document.getElementById('next').onclick=()=>shiftDate(1);
document.getElementById('todayBtn').onclick=()=>setDate(todayKey());
document.getElementById('dateLabel').onclick=()=>{ const p=document.getElementById('datePick'); p.showPicker?p.showPicker():p.click(); };
document.getElementById('datePick').onchange=e=>{ if(e.target.value) setDate(e.target.value); };
document.getElementById('branchSeg').addEventListener('click',e=>{
  const btn=e.target.closest('button'); if(!btn) return; filter=btn.dataset.b;
  [...e.currentTarget.children].forEach(b=>b.setAttribute('aria-pressed',b===btn)); if(data){ board.innerHTML=''; render(); }
});
function fitBoard(){ document.querySelector('.main').style.height=(window.innerHeight-document.querySelector('header').offsetHeight)+'px'; }
fitBoard(); window.addEventListener('resize',fitBoard);
let lastMode=isMobile();
let rzT=null;
window.addEventListener('resize',()=>{ const m=isMobile(); if(m!==lastMode){ lastMode=m; if(data){ board.innerHTML=''; render(); } return; }
  if(!m){ clearTimeout(rzT); rzT=setTimeout(()=>{ if(data) render(); },150); } });

load();
setInterval(()=>{ if(!document.hidden) load(); }, 60000);   // 每分鐘即時重抓
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && lastOk && Date.now()-lastOk>60000) load(); });
</script>
</body>
